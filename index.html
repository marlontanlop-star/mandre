<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital Premium | LG webOS Native</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: {
                            bg: '#0a0a0a',       
                            card: '#141414',     
                            border: '#222222',   
                            gold: '#D4AF37',     
                            textMuted: '#888888' 
                        }
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Ajustes críticos de hardware para el procesador gráfico de TV LG */
        * {
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-perspective: 1000;
            perspective: 1000;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            color: #ffffff; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ::-webkit-scrollbar { display: none; }
        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }
        
        /* Transición por hardware nativo para evitar saltos de fotogramas */
        .tv-fade {
            opacity: 0;
            -webkit-transition: opacity 0.5s ease-in-out;
            transition: opacity 0.5s ease-in-out;
        }
        .tv-fade-active {
            opacity: 1;
        }
    </style>
</head>
<body class="w-screen h-screen p-16 flex flex-col justify-between relative overflow-hidden select-none">

    <main id="kiosk-main" class="tv-fade flex-1 my-auto flex items-center justify-center w-full">
        </main>

    <footer class="flex justify-end items-center shrink-0 w-full pt-4">
        <div class="flex items-center gap-2.5 opacity-30">
            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-[0.2em]">Power By</span>
            <span class="font-sans font-normal text-slate-400 text-base tracking-tight">Tan<b class="font-bold text-slate-200">Alza</b></span>
        </div>
    </footer>

    <button id="btn-fullscreen" class="fixed bottom-6 left-6 z-[999] bg-premium-card hover:bg-black text-white px-6 py-4 rounded-full shadow-2xl font-bold flex items-center gap-3 border border-premium-border text-xs tracking-wider uppercase">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Iniciar Kiosko HD
    </button>

    <script>
        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        // Inicializar Firebase de forma nativa
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Variables de estado en memoria global (Consumo mínimo de RAM)
        let dataset = {
            products: [],
            config: null
        };

        let loopState = {
            currentPhase: 'welcome', // welcome -> cafe_dia -> product_focus
            productIndex: 0,
            secondsCounter: 0
        };

        const kioskMain = document.getElementById('kiosk-main');

        // --- CAPTURA DE DATOS EN TIEMPO REAL ---
        db.collection('inventory').onSnapshot(function(snap) {
            let items = [];
            snap.forEach(function(doc) {
                items.push(doc.data());
            });
            // Ordenar: Destacados primero
            dataset.products = items.sort(function(a, b) {
                return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
            });
            // Forzar actualización suave si está en fase de productos
            if(loopState.currentPhase === 'product_focus') renderCurrentScreen();
        });

        db.collection('configuracionTV').doc('actual').onSnapshot(function(doc) {
            if (doc.exists) {
                dataset.config = doc.data();
                if(loopState.currentPhase === 'welcome' || loopState.currentPhase === 'cafe_dia') renderCurrentScreen();
            }
        });

        // --- MOTOR DE REDERIZADO MANUAL (VANILLA NATIVO) ---
        function renderCurrentScreen() {
            // Aplicar efecto fade-out antes de cambiar el HTML
            kioskMain.classList.remove('tv-fade-active');
            
            setTimeout(function() {
                let html = '';

                // CASO 1: BIENVENIDA
                if (loopState.currentPhase === 'welcome') {
                    let texto = (dataset.config && dataset.config.publicidadRecurrente) ? dataset.config.publicidadRecurrente.textoConfigurable : "Disfruta un momento exclusivo";
                    html = `
                        <div class="text-center space-y-6 max-w-5xl">
                            <span class="text-premium-gold text-sm font-bold tracking-[0.6em] uppercase block">Sugerencia Especial</span>
                            <h2 class="text-6xl md:text-7xl font-black text-white uppercase leading-tight tracking-tighter">${texto}</h2>
                            <div class="w-24 h-[2px] bg-premium-gold mx-auto mt-8 opacity-40"></div>
                        </div>
                    `;
                }
                
                // CASO 2: CAFÉ DE ORIGEN
                else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                    let cafe = dataset.config.cafePromocion;
                    let mediaHtml = cafe.logoUrl 
                        ? `<div class="p-8 bg-premium-card rounded-[3.5rem] border border-premium-border shadow-2xl"><img src="${cafe.logoUrl}" class="w-96 h-96 object-contain" /></div>`
                        : `<div class="w-96 h-96 bg-premium-card border border-premium-border rounded-[3.5rem] flex items-center justify-center text-[10rem]">☕</div>`;
                    
                    html = `
                        <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-16 items-center max-w-7xl">
                            <div class="lg:col-span-5 flex justify-center">${mediaHtml}</div>
                            <div class="lg:col-span-7 text-left space-y-8">
                                <div class="inline-block border border-premium-gold/40 text-premium-gold text-xs font-bold tracking-[0.4em] uppercase bg-premium-gold/5 px-5 py-2 rounded-full">FILTRADO HOY</div>
                                <h2 class="text-7xl font-black text-white tracking-tighter leading-none">CAFÉ DE ORIGEN</h2>
                                <div class="grid grid-cols-2 gap-6 pt-4">
                                    <div class="bg-premium-card p-6 rounded-3xl border border-premium-border">
                                        <p class="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Procedencia</p>
                                        <p class="text-2xl font-bold text-white uppercase mt-1.5">${cafe.municipio || ''}</p>
                                        <p class="text-sm font-semibold text-premium-gold uppercase mt-0.5">${cafe.vereda || ''}</p>
                                    </div>
                                    <div class="bg-premium-card p-6 rounded-3xl border border-premium-border">
                                        <p class="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Altura de Cultivo</p>
                                        <p class="text-2xl font-bold text-white uppercase mt-1.5">${cafe.altura || ''} <span class="text-sm text-premium-textMuted font-normal">m.s.n.m</span></p>
                                    </div>
                                    <div class="bg-premium-card p-8 rounded-3xl border border-premium-border col-span-2">
                                        <p class="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest mb-2">Notas de Cata Detectadas</p>
                                        <p class="text-3xl font-black text-premium-gold uppercase tracking-tight">${cafe.notas || ''}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // CASO 3: PASARELA DE PRODUCTO INDIVIDUAL
                else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                    let prod = dataset.products[loopState.productIndex];
                    if (prod) {
                        let badgeDestacado = prod.isPromoted ? `<span class="text-[9px] font-black text-premium-bg bg-premium-gold px-3 py-1 rounded-full uppercase tracking-widest shadow-md">Recomendado ⭐</span>` : '';
                        let descripcionHtml = prod.description ? `<p class="text-lg text-premium-textMuted font-medium leading-relaxed max-w-lg pt-2 border-l-2 border-premium-border pl-4">${prod.description}</p>` : '';
                        
                        let imgHtml = prod.imageUrl 
                            ? `<div class="w-full max-w-lg aspect-square rounded-[4rem] overflow-hidden shadow-2xl border-2 border-premium-border relative bg-premium-card flex items-center justify-center"><img src="${prod.imageUrl}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=\"text-9xl\">${prod.icon || '☕'}</span>'"/></div>`
                            : `<div class="w-full max-w-lg aspect-square bg-premium-card border-2 border-premium-border rounded-[4rem] flex flex-col items-center justify-center text-9xl shadow-2xl"><span>${prod.icon || '☕'}</span></div>`;

                        html = `
                            <div class="w-full h-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-16 items-center justify-center">
                                <div class="lg:col-span-6 flex justify-center relative">${imgHtml}</div>
                                <div class="lg:col-span-6 text-left space-y-6 flex flex-col justify-center">
                                    <div class="flex items-center gap-3">
                                        <span class="text-[10px] font-bold text-premium-textMuted uppercase tracking-[0.4em] bg-premium-card px-4 py-1.5 rounded-full border border-premium-border">${prod.category}</span>
                                        ${badgeDestacado}
                                    </div>
                                    <h2 class="text-6xl font-black text-white tracking-tighter uppercase leading-tight max-w-xl">${prod.name}</h2>
                                    ${descripcionHtml}
                                    <div class="pt-6">
                                        <span class="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest block mb-1">Precio de Venta</span>
                                        <div class="inline-block text-5xl font-black text-premium-gold tracking-tighter leading-none bg-premium-card border border-premium-border px-8 py-4 rounded-3xl shadow-xl">
                                            <span class="text-3xl font-light mr-1 opacity-70">$</span>${Number(prod.price).toLocaleString()}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                kioskMain.innerHTML = html;
                // Aplicar efecto fade-in tras pintar el HTML
                kioskMain.classList.add('tv-fade-active');
            }, 50); 
        }

        // --- RELOJ INTEGRADO PASIVO (1 TIC POR SEGUNDO) ---
        setInterval(function() {
            loopState.secondsCounter++;

            if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
                if (dataset.config && dataset.config.cafePromocion) {
                    loopState.currentPhase = 'cafe_dia';
                } else if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 10) {
                if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                } else {
                    loopState.currentPhase = 'welcome';
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
                loopState.secondsCounter = 0;
                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++;
                    renderCurrentScreen();
                } else {
                    loopState.currentPhase = 'welcome';
                    loopState.productIndex = 0;
                    renderCurrentScreen();
                }
            }
        }, 1000);

        // Lanzar pantalla de bienvenida inicial
        renderCurrentScreen();

        // --- MANEJO DE PANTALLA COMPLETA NATIVA (webOS API friendly) ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        
        btnFullscreen.addEventListener('click', function() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                btnFullscreen.style.display = 'none';
            } else {
                btnFullscreen.style.display = 'flex';
            }
        });
        document.addEventListener('webkitfullscreenchange', function() {
            if (document.webkitFullscreenElement) {
                btnFullscreen.style.display = 'none';
            } else {
                btnFullscreen.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
