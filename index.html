<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil vs Marruecos - La Oficina Coffee Bar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin: 0;
        }

        .kiosk {
            width: 92%;
            max-width: 1100px;
            text-align: center;
            padding: 50px 40px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 3px solid rgba(255,215,0,0.4);
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .tagline {
            font-size: 1.55rem;
            opacity: 0.9;
            margin-bottom: 45px;
        }

        .match {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            margin: 45px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s;
        }

        .team:hover {
            transform: scale(1.06);
        }

        .flag {
            width: 180px;
            height: 115px;
            border-radius: 10px;
            border: 5px solid #fff;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            margin-bottom: 16px;
            transition: all 0.5s;
        }

        .team:hover .flag {
            box-shadow: 0 20px 40px rgba(255,215,0,0.6);
        }

        .vs {
            font-size: 3.5rem;
            font-weight: 700;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250,204,21,0.7);
        }

        .info {
            background: rgba(0,0,0,0.45);
            padding: 25px 50px;
            border-radius: 18px;
            margin: 35px auto;
            max-width: 620px;
            font-size: 1.45rem;
        }

        .time {
            font-size: 2.6rem;
            font-weight: 700;
            color: #facc15;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        .footer {
            margin-top: 45px;
            font-size: 1.35rem;
            opacity: 0.9;
        }

        .start-btn {
            margin-top: 40px;
            padding: 20px 80px;
            font-size: 1.8rem;
            font-weight: 700;
            background: #facc15;
            color: #0f172a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(250, 204, 21, 0.5);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.08);
            background: #eab308;
        }

        /* Partículas */
        .particle {
            position: absolute;
            color: #facc15;
            font-size: 1.8rem;
            pointer-events: none;
            animation: floatUp 9s linear infinite;
            opacity: 0.55;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-150px) rotate(360deg); }
        }

        /* Mejorar en pantallas grandes / TV */
        @media (min-width: 1400px) {
            .kiosk {
                padding: 70px 60px;
                max-width: 1300px;
            }
            h1 { font-size: 4rem; }
            .flag { width: 220px; height: 140px; }
            .vs { font-size: 4.2rem; }
            .time { font-size: 3.2rem; }
        }
    </style>
</head>
<body>
    <div class="kiosk" id="kiosk">
        <div class="logo">
            <div>
                <h1>LA OFICINA</h1>
                <div style="font-size: 1.3rem; letter-spacing: 5px; opacity: 0.85;">COFFEE BAR</div>
            </div>
        </div>

        <div class="tagline">¡Hoy la oficina se convierte en estadio!</div>

        <div class="match">
            <!-- Brasil -->
            <div class="team">
                <div class="flag" style="background: linear-gradient(#00A859 50%, #FFCD00 50%); position: relative;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 55px; height: 55px; border: 10px solid #002776; border-radius: 50%;"></div>
                </div>
                <strong style="font-size: 2rem;">Brasil</strong>
            </div>

            <div class="vs">VS</div>

            <!-- Marruecos -->
            <div class="team">
                <div class="flag" style="background: #C8102E; position: relative; overflow: hidden;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #006233; font-size: 68px; line-height: 1;">★</div>
                </div>
                <strong style="font-size: 2rem;">Marruecos</strong>
            </div>
        </div>

        <div class="info">
            <strong>Copa Mundial FIFA 2026</strong><br>
            Fase de Grupos • Grupo C
        </div>

        <div class="time">Hoy • 5:00 p.m.</div>

        <div class="footer">
            Pregunta por nuestros combos especiales<br>
            <strong>¡Gooooool!</strong> ⚽
        </div>

        <button class="start-btn" onclick="toggleFullscreen()">
            INICIAR EN PANTALLA COMPLETA
        </button>
    </div>

    <script>
        function toggleFullscreen() {
            const elem = document.documentElement; // Todo el documento

            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Partículas
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = ['⚽', '★', '🇧🇷'][Math.floor(Math.random() * 3)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 7 + 8) + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.45;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 18000);
        }

        setInterval(createParticle, 420);

        // Efecto inicial
        window.onload = () => {
            const vs = document.querySelector('.vs');
            setTimeout(() => {
                vs.style.transition = 'all 1.5s ease';
                vs.style.transform = 'scale(1.15)';
            }, 700);
            setTimeout(() => vs.style.transform = 'scale(1)', 2200);
        };

        // Doble clic también activa fullscreen
        document.addEventListener('dblclick', toggleFullscreen);

        // Mensaje de ayuda (se oculta solo)
        console.log("%cPresiona F11 o doble clic para pantalla completa", "color:#facc15; font-size:16px");
    </script>
</body>
</html>
