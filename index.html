<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosco Digital Exterior | LA OFICINA Anserma</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- BLINDAJE ABSOLUTO ANTI-DESBORDE PARA SMART TV LG --- */
        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            background-color: #FFFFFF; /* Blanco anti-reflejos */
            color: #111111;
            font-family: 'Montserrat', sans-serif;
            position: fixed; /* Evita cualquier intento de scroll del navegador */
            top: 0;
            left: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Área central exacta controlada */
        main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 88vh; /* Reserva el 12% restante para el footer de forma estricta */
            overflow: hidden;
        }

        /* Transición por Hardware */
        .tv-fade {
            opacity: 0;
            -webkit-transition: opacity 0.3s ease-in-out;
            transition: opacity 0.3s ease-in-out;
            width: 100%;
            height: 100%;
        }
        .tv-fade-active {
            opacity: 1;
        }

        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }

        .text-accent { color: #8C6239; } 
        .text-dark { color: #000000; }
        .text-muted { color: #666666; font-weight: 700; }
        
        /* --- ESTRUCTURA DE CAPAS LIMITADAS GEOMÉTRICAMENTE --- */
        .layout-container {
            position: absolute;
            top: 4vh;
            left: 4vw;
            width: 92vw;
            height: 80vh;
        }

        /* Contenedor Izquierdo para la foto: Nunca medirá más del 44% del ancho del TV */
        .col-left-photo {
            position: absolute;
            left: 0;
            top: 0;
            width: 44vw;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Contenedor Derecho para la información: Crece sin empujar la foto */
        .col-right-info {
            position: absolute;
            left: 49vw;
            top: 0;
            width: 43vw;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            overflow: hidden;
        }

        /* CAJA PROTECTORA DE IMAGEN NATIVA */
        .image-box-safe {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05); 
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-box-safe img {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important; /* Mantiene la proporción exacta dentro de la caja */
            background-color: #FFFFFF;
            border-radius: 32px;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            border-radius: 32px;
        }

        /* Componentes del menú con fuentes ajustadas para webOS */
        .badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .badge-muted { background-color: #F1F3F5; color: #495057; }
        .badge-accent { background-color: #8C6239; color: #FFFFFF; margin-left: 8px; }

        .price-box {
            display: inline-block;
            font-size: 56px; /* Ajustado de 72px para evitar desbordes */
            font-weight: 900;
            color: #000000;
            background-color: #F8F9FA;
            padding: 6px 32px;
            border-radius: 20px;
            margin-top: 12px;
            letter-spacing: -2px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.01);
        }

        .cafe-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 12px; }
        .cafe-card { background: #F8F9FA; padding: 16px 20px; border-radius: 20px; flex: 1; min-width: 45%; }
        .cafe-card-full { width: 100%; background: #F8F9FA; padding: 20px; border-radius: 20px; margin-top: 12px; }

        /* Vistas de Texto en Pantalla Completa */
        .center-layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 88vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6vw;
        }

        .phrase-container {
            text-align: center;
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            background-color: #FFFDF9;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(140,98,57,0.03);
        }

        /* Footer Fijo en la Base */
        footer { 
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 12vh;
            padding: 0 5vw 3vh 0;
            display: flex; 
            justify-content: flex-end; 
            align-items: center;
            opacity: 0.6; 
        }
        .footer-brand { font-size: 12px; color: #111111; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .footer-brand b { color: #8C6239; font-weight: 900; }

        .btn-kiosk {
            position: fixed; bottom: 20px; left: 20px; z-index: 999;
            background: #111111; color: white; padding: 12px 24px;
            border-radius: 30px; font-weight: 900; border: none;
            cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main id="kiosk-main" class="tv-fade">
        </main>

    <footer>
        <div class="footer-brand">
            Power By <span>Tan<b>Alza</b></span>
        </div>
    </footer>

    <button id="btn-fullscreen" class="btn-kiosk">Iniciar Kiosko Exterior</button>

    <script>
        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let dataset = { products: [], config: null };
        
        let loopState = { 
            currentPhase: 'welcome', 
            productIndex: 0, 
            secondsCounter: 0,
            productsShownInSession: 0, 
            phraseIndex: 0
        };

        const localPhrases = [
            "El mejor punto de encuentro en la 'Abuela de Caldas'. ¡Ven a La Oficina por tu dosis de bienestar!",
            "Café de especialidad cultivado en nuestras montañas caldenses, servido con orgullo en Anserma.",
            "¿Trabajo, amigos o un respiro? El espacio ideal para conectar y recargar tus energías está en La Oficina.",
            "Pasión por los detalles, amor por el origen. Vive la verdadera cultura cafetera en el corazón de Anserma.",
            "Mucho más que una taza de café. Creamos experiencias premium de Specialty Coffee & Wellness para ti."
        ];

        const kioskMain = document.getElementById('kiosk-main');

        // Escuchar Inventario con Filtro de Transmisión
        db.collection('inventory').onSnapshot(function(snap) {
            let items = [];
            snap.forEach(function(doc) {
                let p = doc.data();
                if (p.showOnTv !== false) { items.push(p); }
            });
            dataset.products = items.sort(function(a, b) {
                return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
            });
            if(loopState.currentPhase === 'product_focus' && (!dataset.config || !dataset.config.pautaExpressActiva)) renderCurrentScreen();
        });

        // Escuchar Cambios de Configuración de la TV (Incluye interrupción Express)
        db.collection('configuracionTV').doc('actual').onSnapshot(function(doc) {
            if (doc.exists) {
                dataset.config = doc.data();
                renderCurrentScreen(); 
            }
        });

        window.handleImageError = function(imageElement) {
            if(imageElement && imageElement.parentElement) {
                imageElement.parentElement.innerHTML = '<div class="image-placeholder"></div>';
            }
        };

        // --- MOTOR RENDER CON ARQUITECTURA MAESTRA ANTI-DESBORDES ---
        function renderCurrentScreen() {
            kioskMain.classList.remove('tv-fade-active');
            
            setTimeout(function() {
                let html = '';

                // CASO ESPECIAL: PAUTA DE TEMPORADA FIJA DESDE EL ADMIN
                if (dataset.config && dataset.config.pautaExpressActiva === true) {
                    let tituloExpress = dataset.config.pautaExpressTitulo || "ANUNCIO ESPECIAL";
                    let textoExpress = dataset.config.pautaExpressTexto || "Promoción exclusiva disponible ahora.";
                    html = `
                        <div class="center-layout">
                            <div class="phrase-container" style="border: 4px solid #8C6239; background-color: #FFFDF9;">
                                <span class="badge badge-accent" style="margin-bottom:15px; padding: 8px 20px; font-size:13px;">DESTACADO DE LA SEMANA 🚨</span>
                                <h2 style="font-size: 46px; font-weight: 900; line-height: 1.1; color: #8C6239; text-transform: uppercase; letter-spacing: -1px; margin: 0 0 15px 0;">${tituloExpress}</h2>
                                <p style="font-size: 24px; font-weight: 700; color: #111111; line-height: 1.4; margin: 0; max-width:850px; margin: 0 auto;">${textoExpress}</p>
                                <p class="text-muted" style="font-size: 11px; margin-top: 25px; letter-spacing: 3px; text-transform: uppercase;">La Oficina Anserma • Sabores de Temporada</p>
                            </div>
                        </div>
                    `;
                    kioskMain.innerHTML = html;
                    kioskMain.classList.add('tv-fade-active');
                    return;
                }

                // CASO 1: PANTALLA BIENVENIDA
                if (loopState.currentPhase === 'welcome') {
                    let texto = (dataset.config && dataset.config.publicidadRecurrente) ? dataset.config.publicidadRecurrente.textoConfigurable : "Bienvenidos a una experiencia exclusiva";
                    html = `
                        <div class="center-layout">
                            <div style="text-align: center; max-width: 900px;">
                                <span class="text-accent" style="font-size: 14px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; display: block; margin-bottom: 20px;">Recomendación Especial</span>
                                <h2 style="font-size: 54px; font-weight: 900; line-height: 1.1; text-transform: uppercase; color: #000000; letter-spacing: -2px; margin: 0;">${texto}</h2>
                                <div style="width: 120px; height: 4px; background-color: #8C6239; margin: 25px auto 0 auto;"></div>
                            </div>
                        </div>
                    `;
                }
                
                // CASO 2: CAFÉ DE ORIGEN DEL DÍA
                else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                    let cafe = dataset.config.cafePromocion;
                    let cafeImg = cafe.logoUrl || cafe.logourl || cafe.imageUrl || cafe.imageurl || "";
                    let imgSection = (cafeImg && cafeImg.length > 10)
                        ? `<div class="image-box-safe"><img src="${cafeImg}" onerror="window.handleImageError(this)" /></div>`
                        : `<div class="image-box-safe"><div class="image-placeholder"></div></div>`;
                    
                    html = `
                        <div class="layout-container">
                            <div class="col-left-photo">${imgSection}</div>
                            <div class="col-right-info">
                                <div class="badge badge-accent" style="margin-left: 0; width: fit-content;">FILTRADO HOY</div>
                                <h2 style="font-size: 52px; font-weight: 900; letter-spacing: -2px; margin: 0 0 10px 0; line-height: 1; color:#000;">CAFÉ DE ORIGEN</h2>
                                <div class="cafe-grid">
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Procedencia</p>
                                        <p style="font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 4px 0 0 0; color:#000;">${cafe.municipio || ''}</p>
                                        <p class="text-accent" style="font-size: 13px; font-weight: 900; text-transform: uppercase; margin: 2px 0 0 0;">${cafe.vereda || ''}</p>
                                    </div>
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Altura Cultivo</p>
                                        <p style="font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 4px 0 0 0; color:#000;">${cafe.altura || ''} <span style="font-size: 13px; font-weight: 700; color:#666;">m</span></p>
                                    </div>
                                </div>
                                <div class="cafe-card-full">
                                    <p class="text-muted" style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px 0;">Notas de Cata Detectadas</p>
                                    <p class="text-accent" style="font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0;">${cafe.notas || ''}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // CASO 3: PASARELA INDIVIDUAL DE PRODUCTOS
                else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                    let prod = dataset.products[loopState.productIndex];
                    if (prod) {
                        let badgeDestacado = prod.isPromoted ? `<span class="badge badge-accent">Recomendado ⭐</span>` : '';
                        let descripcionHtml = prod.description ? `<p class="text-dark" style="font-size: 20px; font-weight: 700; line-height: 1.4; margin: 12px 0; border-left: 4px solid #8C6239; padding-left: 15px;">${prod.description}</p>` : '';
                        
                        let linkFoto = prod.imageUrl || prod.imageurl || prod.image || prod.url || "";
                        let imgSection = (linkFoto && linkFoto.length > 10)
                            ? `<div class="image-box-safe"><img src="${linkFoto}" onerror="window.handleImageError(this)"/></div>`
                            : `<div class="image-box-safe"><div class="image-placeholder"></div></div>`;

                        html = `
                            <div class="layout-container">
                                <div class="col-left-photo">${imgSection}</div>
                                <div class="col-right-info">
                                    <div style="display: flex; align-items: center; width: fit-content;">
                                        <span class="badge badge-muted">${prod.category}</span>
                                        ${badgeDestacado}
                                    </div>
                                    <h2 style="font-size: 54px; font-weight: 900; letter-spacing: -2px; text-transform: uppercase; margin: 0; line-height: 1.1; color:#000;">${prod.name}</h2>
                                    ${descripcionHtml}
                                    <div style="margin-top: 12px;">
                                        <span class="text-muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom:4px;">Precio de Venta</span>
                                        <div class="price-box"><span style="font-size: 28px; font-weight: 400; margin-right: 4px; color:#555;">$</span>${Number(prod.price).toLocaleString()}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                // CASO 4: BANCO DE FRASES DE ANSERMA
                else if (loopState.currentPhase === 'local_phrase') {
                    let fraseActual = localPhrases[loopState.phraseIndex];
                    html = `
                        <div class="center-layout">
                            <div class="phrase-container">
                                <span class="text-accent" style="font-size: 14px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; display: block; margin-bottom: 20px;">La Oficina Anserma</span>
                                <h2 style="font-size: 38px; font-weight: 900; line-height: 1.3; color: #000000; margin: 0; letter-spacing:-1px;">"${fraseActual}"</h2>
                                <p class="text-muted" style="font-size: 12px; margin-top: 20px; letter-spacing: 2px; text-transform: uppercase;">Specialty Coffee & Wellness • Caldas</p>
                            </div>
                        </div>
                    `;
                }

                kioskMain.innerHTML = html;
                kioskMain.classList.add('tv-fade-active');
            }, 50); 
        }

        // --- ENGRANAJE DE TIEMPOS ---
        setInterval(function() {
            if(dataset.config && dataset.config.pautaExpressActiva === true) return;

            loopState.secondsCounter++;

            if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
                if (dataset.config && dataset.config.cafePromocion) { loopState.currentPhase = 'cafe_dia'; } 
                else if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; }
                loopState.secondsCounter = 0; renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 10) {
                if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; } 
                else { loopState.currentPhase = 'welcome'; }
                loopState.secondsCounter = 0; renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
                loopState.secondsCounter = 0;
                loopState.productsShownInSession++; 

                if (loopState.productsShownInSession >= 4) {
                    loopState.productsShownInSession = 0; 
                    loopState.currentPhase = 'local_phrase';
                    renderCurrentScreen();
                } else {
                    if (loopState.productIndex + 1 < dataset.products.length) {
                        loopState.productIndex++; renderCurrentScreen();
                    } else {
                        loopState.currentPhase = 'welcome'; loopState.productIndex = 0; renderCurrentScreen();
                    }
                }
            }
            else if (loopState.currentPhase === 'local_phrase' && loopState.secondsCounter >= 8) {
                loopState.secondsCounter = 0;
                loopState.phraseIndex = (loopState.phraseIndex + 1) % localPhrases.length;

                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++; loopState.currentPhase = 'product_focus';
                } else {
                    loopState.currentPhase = 'welcome'; loopState.productIndex = 0;
                }
                renderCurrentScreen();
            }
        }, 1000);

        renderCurrentScreen();

        // --- PANTALLA COMPLETA NATIVA EN LG ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', function() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        });

        function checkFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) { btnFullscreen.style.display = 'none'; } 
            else { btnFullscreen.style.display = 'block'; }
        }
        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
    </script>
</body>
</html>
