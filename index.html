<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL INTELIGENTE | LA OFICINA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --oficina-verde: #4b5320;
            --oficina-dark: #1a1c0b;
            --rosa-fuerte: #d44d8d;
            --rosa-claro: #fce4ec;
            --rosa-vibrante: #ff4081;
            --crema-floral: #fff5f8;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: var(--oficina-dark); 
            font-family: 'Montserrat', sans-serif; height: 100vh;
        }

        /* Fondo Animado */
        .bg-floral {
            background-color: var(--crema-floral);
            display: flex; height: 100vh; width: 100vw;
            position: relative;
        }

        /* Pétalos flotantes */
        .petal {
            position: absolute;
            background: var(--rosa-vibrante);
            border-radius: 150% 0 150% 0;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
            animation: float 12s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) translateX(150px) rotate(360deg); opacity: 0; }
        }

        /* Estructura Principal de Productos */
        .tv-container {
            width: 50vw; height: 100vh; padding: 5vh 4vw;
            display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; z-index: 10;
            background: rgba(255, 255, 248, 0.9);
            backdrop-filter: blur(10px);
        }

        .price-tag { 
            text-shadow: 3px 3px 0px rgba(212, 77, 141, 0.1); 
            color: var(--rosa-fuerte); font-weight: 900; font-size: 7.5vw;
        }

        .image-side { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .image-side img { width: 100%; height: 100%; object-fit: cover; transition: transform 15s linear; }
        .zoom-effect { transform: scale(1.25); }

        /* VISTA MAMÁ: CENTRADO TOTAL */
        #view-mama {
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #fff0f6 0%, #fce4ec 100%);
            position: relative;
            z-index: 20;
        }

        .mama-card {
            width: 80vw;
            max-width: 1200px;
            background: white;
            padding: 8vh 5vw;
            border-radius: 60px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(212, 77, 141, 0.15);
            border: 2px solid var(--rosa-claro);
            position: relative;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .discount-badge {
            display: inline-block;
            background: var(--rosa-fuerte);
            color: white;
            padding: 1.5vh 3vw;
            border-radius: 100px;
            font-weight: 900;
            font-size: 4vw;
            margin: 3vh 0;
            box-shadow: 0 10px 30px rgba(212, 77, 141, 0.4);
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }
    </style>
</head>
<body>

    <div id="view-start" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--oficina-dark); color: white;">
        <h1 style="font-size: 3vw; font-weight: 900; letter-spacing: 10px;">LA OFICINA</h1>
        <button onclick="iniciar()" style="background: var(--rosa-fuerte); color: white; padding: 2vh 4vw; border-radius: 50px; border: none; font-weight: 900; font-size: 1.5vw; cursor: pointer;">ACTIVAR TERMINAL</button>
    </div>

    <div id="view-main" class="hidden bg-floral">
        <div id="petals-container"></div>
        <div class="tv-container">
            <div id="ui-cat" style="font-weight: 900; color: var(--rosa-fuerte); text-transform: uppercase; letter-spacing: 3px; font-size: 1.2vw;">CATEGORÍA</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <h1 id="ui-name" style="line-height: 0.9; font-weight: 900; text-transform: uppercase; color: var(--oficina-dark); margin: 0;">PRODUCTO</h1>
                <p id="ui-desc" style="font-size: 2.2vw; font-weight: 400; color: #666; margin-top: 2vh;">Descripción detallada del producto.</p>
            </div>
            <div>
                <div id="ui-price" class="price-tag">$0</div>
                <div style="margin-top: 3vh; padding-top: 3vh; border-top: 2px solid var(--rosa-claro); display: flex; align-items: center; gap: 1.5vw;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://instagram.com/laoficinaanserma" style="width: 5vw; height: 5vw;">
                    <p style="font-weight: 900; font-size: 1.5vw; color: var(--rosa-fuerte); margin: 0;">@laoficinaanserma</p>
                </div>
            </div>
        </div>
        <div class="image-side">
            <img id="ui-img" src="">
            <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(255,245,248,1) 0%, transparent 15%);"></div>
        </div>
    </div>

    <div id="view-mama" class="hidden">
        <div class="mama-card">
            <p style="font-weight: 900; letter-spacing: 5px; color: var(--rosa-fuerte); margin-bottom: 2vh; font-size: 1.2vw;">ESTE 9 Y 10 DE MAYO</p>
            <h2 style="font-size: 6.5vw; font-weight: 900; line-height: 0.9; color: var(--oficina-dark); margin: 0;">
                CELEBRA A <br><span style="color: var(--rosa-fuerte);">MAMÁ</span> EN LA OFICINA
            </h2>
            <div class="discount-badge">10% DE DESCUENTO</div>
            <p style="font-size: 2.2vw; font-weight: 400; color: #555; max-width: 80%; margin: 0 auto; line-height: 1.4;">
                Trae a la reina de la casa y recibe un beneficio exclusivo en el total de tu cuenta por venir con ella.
            </p>
            <div style="margin-top: 5vh; font-size: 1.5vw; font-weight: 900; color: var(--oficina-verde);">🌸 ¡TE ESPERAMOS! 🌸</div>
        </div>
    </div>

    <script>
        var items = [];
        var allDocs = [];
        var currentIndex = 0;
        var prodCounter = 0;

        function iniciar() {
            try { document.documentElement.requestFullscreen(); } catch (e) {}
            createPetals();
            document.getElementById('view-start').classList.add('hidden');
            loadData(""); 
        }

        function createPetals() {
            const container = document.getElementById('petals-container');
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 20 + 10 + 'px';
                petal.style.height = petal.style.width;
                petal.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(petal);
            }
        }

        function loadData(pageToken) {
            var xhr = new XMLHttpRequest();
            var url = "https://firestore.googleapis.com/v1/projects/mandre-f9e43/databases/(default)/documents/inventory?pageSize=300" + (pageToken ? "&pageToken="+pageToken : "");
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (data.documents) allDocs = allDocs.concat(data.documents);
                    if (data.nextPageToken) loadData(data.nextPageToken);
                    else procesarDocumentos();
                }
            };
            xhr.send();
        }

        function procesarDocumentos() {
            items = [];
            for (var i = 0; i < allDocs.length; i++) {
                var f = allDocs[i].fields;
                if (!f) continue;
                var isPromoted = f.isPromoted && (f.isPromoted.booleanValue === true || f.isPromoted.stringValue === "true");
                var imageUrl = f.imageUrl ? f.imageUrl.stringValue : (f.imagen ? f.imagen.stringValue : null);
                if (isPromoted && imageUrl) {
                    items.push({
                        name: f.name ? f.name.stringValue : "PRODUCTO",
                        price: f.price ? Number(f.price.integerValue || f.price.doubleValue || f.price.stringValue || 0) : 0,
                        desc: f.description ? f.description.stringValue : "",
                        img: imageUrl,
                        cat: f.category ? f.category.stringValue : "MENÚ"
                    });
                }
            }
            if (items.length > 0) { render(); setInterval(render, 10000); }
        }

        function render() {
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-mama').classList.add('hidden');
            document.getElementById('view-main').classList.remove('flex');
            document.getElementById('view-mama').classList.remove('flex');

            if (prodCounter >= 2) {
                document.getElementById('view-mama').classList.remove('hidden');
                document.getElementById('view-mama').classList.add('flex');
                prodCounter = 0;
            } else {
                document.getElementById('view-main').classList.remove('hidden');
                document.getElementById('view-main').classList.add('flex');
                
                var data = items[currentIndex];
                document.getElementById('ui-cat').innerText = data.cat;
                document.getElementById('ui-name').innerText = data.name;
                document.getElementById('ui-desc').innerText = data.desc;
                document.getElementById('ui-price').innerText = "$" + data.price.toLocaleString('es-CO');
                
                var img = document.getElementById('ui-img');
                img.src = data.img;
                img.classList.remove('zoom-effect');
                setTimeout(() => { img.classList.add('zoom-effect'); }, 100);

                var n = data.name.length;
                document.getElementById('ui-name').style.fontSize = n < 8 ? "8vw" : n < 15 ? "6vw" : "4.5vw";
                
                currentIndex = (currentIndex + 1) % items.length;
                prodCounter++;
            }
        }
    </script>
</body>
</html>
