<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil vs Marruecos - La Oficina Coffee Bar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .kiosk {
            width: 100%;
            max-width: 820px;
            text-align: center;
            padding: 40px 30px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1.35rem;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .match {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.4s;
        }

        .team:hover {
            transform: scale(1.08);
        }

        .flag {
            width: 140px;
            height: 90px;
            border-radius: 8px;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 12px;
            transition: all 0.5s;
        }

        .team:hover .flag {
            box-shadow: 0 15px 35px rgba(255,215,0,0.5);
        }

        .vs {
            font-size: 2.8rem;
            font-weight: 700;
            color: #facc15;
            text-shadow: 0 0 20px rgba(250,204,21,0.6);
        }

        .info {
            background: rgba(0,0,0,0.4);
            padding: 20px 40px;
            border-radius: 16px;
            margin: 30px auto;
            max-width: 500px;
            font-size: 1.35rem;
        }

        .time {
            font-size: 2.1rem;
            font-weight: 700;
            color: #facc15;
            margin: 15px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .footer {
            margin-top: 40px;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .start-btn {
            margin-top: 30px;
            padding: 16px 60px;
            font-size: 1.5rem;
            font-weight: 700;
            background: #facc15;
            color: #0f172a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(250, 204, 21, 0.4);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.1);
            background: #eab308;
        }

        /* Partículas sutiles */
        .particle {
            position: absolute;
            color: #facc15;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            opacity: 0.5;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="kiosk" id="kiosk">
        <!-- Logo sin taza de café -->
        <div class="logo">
            <div>
                <h1>LA OFICINA</h1>
                <div style="font-size: 1.1rem; letter-spacing: 4px; opacity: 0.8;">COFFEE BAR</div>
            </div>
        </div>

        <div class="tagline">¡Hoy la oficina se convierte en estadio!</div>

        <!-- Partido -->
        <div class="match">
            <!-- Brasil -->
            <div class="team">
                <div class="flag" style="background: linear-gradient(#00A859 50%, #FFCD00 50%); position: relative;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45px; height: 45px; border: 8px solid #002776; border-radius: 50%;"></div>
                </div>
                <strong style="font-size: 1.6rem;">Brasil</strong>
            </div>

            <div class="vs">VS</div>

            <!-- Marruecos -->
            <div class="team">
                <div class="flag" style="background: #C8102E; position: relative; overflow: hidden;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #006233; font-size: 55px; line-height: 1;">★</div>
                </div>
                <strong style="font-size: 1.6rem;">Marruecos</strong>
            </div>
        </div>

        <div class="info">
            <strong>Copa Mundial FIFA 2026</strong><br>
            Fase de Grupos • Grupo C
        </div>

        <div class="time">Hoy • 5:00 p.m.</div>

        <div class="footer">
            Pregunta por nuestros combos especiales<br>
            <strong>¡Gooooool!</strong> ⚽
        </div>

        <!-- Botón Iniciar -->
        <button class="start-btn" onclick="startFullscreen()">
            INICIAR TRANSMISIÓN
        </button>
    </div>

    <script>
        // Partículas flotantes
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = ['⚽', '★', '🇧🇷'][Math.floor(Math.random() * 3)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 6 + 8) + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.4;
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 16000);
        }

        setInterval(createParticle, 500);

        // Función para pantalla completa
        function startFullscreen() {
            const kiosk = document.getElementById('kiosk');
            
            if (kiosk.requestFullscreen) {
                kiosk.requestFullscreen();
            } else if (kiosk.webkitRequestFullscreen) {
                kiosk.webkitRequestFullscreen();
            } else if (kiosk.msRequestFullscreen) {
                kiosk.msRequestFullscreen();
            }
            
            // Efecto visual al entrar en fullscreen
            kiosk.style.border = '3px solid #facc15';
            setTimeout(() => {
                kiosk.style.border = '2px solid rgba(255,215,0,0.3)';
            }, 2000);
        }

        // Salir de fullscreen con tecla ESC también restaura estilo
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('kiosk').style.border = '2px solid rgba(255,215,0,0.3)';
            }
        });

        // Efecto inicial en VS
        window.onload = () => {
            const vs = document.querySelector('.vs');
            setTimeout(() => {
                vs.style.transition = 'all 1.2s';
                vs.style.transform = 'scale(1.12)';
            }, 600);
            setTimeout(() => {
                vs.style.transform = 'scale(1)';
            }, 1800);
        };
    </script>
</body>
</html>
