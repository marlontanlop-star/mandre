<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: {
                            bg: '#0a0a0a',       // Negro profundo
                            card: '#141414',     // Negro grisáceo elegante
                            border: '#222222',   // Separadores sutiles
                            gold: '#D4AF37',     // Dorado premium para acentos
                            textMuted: '#888888' // Gris de lectura suave
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'fadeScale': 'fadeScale 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeScale: {
                            '0%': { transform: 'scale(1.05)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0a0a0a; color: #ffffff; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN DE TU FIREBASE (Mantiene la sincronización intacta) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const App = () => {
            const [allProducts, setAllProducts] = useState([]);
            const [tvConfig, setTvConfig] = useState(null);
            const [currentScreen, setCurrentScreen] = useState('welcome'); 
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // Índices para controlar qué producto individual se está mostrando
            const [productIndex, setProductIndex] = useState(0);

            useEffect(() => {
                // Escucha todo el catálogo en tiempo real
                const unsubInv = db.collection('inventory').onSnapshot(snap => {
                    setAllProducts(snap.docs.map(doc => doc.data()));
                });

                // Escucha datos del café del día / frases
                const unsubTv = db.collection('configuracionTV').doc('actual').onSnapshot(doc => {
                    if (doc.exists) setTvConfig(doc.data());
                });

                return () => {
                    unsubInv();
                    unsubTv();
                };
            }, []);

            // Combinamos y priorizamos: Primero los destacados en pauta (isPromoted), luego el resto
            const orderedCatalog = useMemo(() => {
                return [...allProducts].sort((a, b) => (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1));
            }, [allProducts]);

            // Motor de rotación inteligente e individual para TV
            useEffect(() => {
                let isMounted = true;
                
                const mainLoop = async () => {
                    if (!isMounted) return;

                    // 1. PANTALLA DE BIENVENIDA (6 segundos)
                    setCurrentScreen('welcome');
                    await new Promise(r => setTimeout(r, 6000));
                    if (!isMounted) return;

                    // 2. PANTALLA DEL CAFÉ DE LA CASA (10 segundos)
                    if (tvConfig?.cafePromocion) {
                        setCurrentScreen('cafe_dia');
                        await new Promise(r => setTimeout(r, 10000));
                    }
                    if (!isMounted) return;

                    // 3. PASARELA INDIVIDUAL DE PRODUCTOS (7 segundos por cada uno)
                    if (orderedCatalog.length > 0) {
                        setCurrentScreen('product_focus');
                        for (let i = 0; i < orderedCatalog.length; i++) {
                            setProductIndex(i);
                            await new Promise(r => setTimeout(r, 7000)); // Tiempo ideal de pauta por item
                            if (!isMounted) return;
                        }
                    }

                    mainLoop(); // Reiniciar ciclo infinito
                };

                if (allProducts.length > 0) {
                    mainLoop();
                }
                
                return () => { isMounted = false; };
            }, [allProducts, tvConfig, orderedCatalog]);

            const handleStartKiosk = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                setIsFullscreen(true);
            };

            useEffect(() => {
                const onFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', onFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', onFullscreenChange);
            }, []);

            // Producto seleccionado en la pasarela actual
            const activeProduct = orderedCatalog[productIndex];

            return (
                <div className="w-screen h-screen bg-premium-bg text-white p-16 flex flex-col justify-between relative overflow-hidden select-none">
                    
                    {/* --- CONTENIDO PRINCIPAL ANIMADO --- */}
                    <main className="flex-1 flex items-center justify-center w-full">
                        
                        {/* CASO 1: TEXTO PUBLICITARIO RECURRENTE */}
                        {currentScreen === 'welcome' && (
                            <div className="text-center space-y-6 max-w-5xl animate-fadeScale">
                                <span className="text-premium-gold text-sm font-bold tracking-[0.6em] uppercase block">Sugerencia Especial</span>
                                <h2 className="text-6xl md:text-7xl font-black text-white uppercase leading-tight tracking-tighter">
                                    {tvConfig?.publicidadRecurrente?.textoConfigurable || "Disfruta un momento exclusivo"}
                                </h2>
                                <div className="w-24 h-[2px] bg-premium-gold mx-auto mt-8 opacity-60"></div>
                            </div>
                        )}

                        {/* CASO 2: CAFÉ DE LA CASA / CAFÉ DEL DÍA */}
                        {currentScreen === 'cafe_dia' && tvConfig?.cafePromocion && (
                            <div className="w-full grid grid-cols-1 lg:grid-cols-12 gap-16 items-center animate-fadeScale max-w-7xl">
                                <div className="lg:col-span-5 flex justify-center">
                                    {tvConfig.cafePromocion.logoUrl ? (
                                        <div className="p-8 bg-premium-card rounded-[3.5rem] border border-premium-border shadow-2xl relative group">
                                            <div className="absolute inset-0 bg-premium-gold/5 rounded-[3.5rem] blur-xl"></div>
                                            <img src={tvConfig.cafePromocion.logoUrl} className="w-96 h-96 object-contain relative z-10" alt="Logo Origen"/>
                                        </div>
                                    ) : (
                                        <div className="w-96 h-96 bg-premium-card border border-premium-border rounded-[3.5rem] flex items-center justify-center text-[10rem] shadow-2xl">☕</div>
                                    )}
                                </div>
                                <div className="lg:col-span-7 text-left space-y-8">
                                    <div className="inline-block border border-premium-gold/40 text-premium-gold text-xs font-bold tracking-[0.4em] uppercase bg-premium-gold/5 px-5 py-2 rounded-full">
                                        FILTRADO HOY
                                    </div>
                                    <h2 className="text-7xl font-black text-white tracking-tighter leading-none">CAFÉ DE ORIGEN</h2>
                                    
                                    <div className="grid grid-cols-2 gap-6 pt-4">
                                        <div className="bg-premium-card p-6 rounded-3xl border border-premium-border shadow-md">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Procedencia</p>
                                            <p className="text-2xl font-bold text-white uppercase mt-1.5">{tvConfig.cafePromocion.municipio}</p>
                                            <p className="text-sm font-semibold text-premium-gold uppercase mt-0.5">{tvConfig.cafePromocion.vereda}</p>
                                        </div>
                                        <div className="bg-premium-card p-6 rounded-3xl border border-premium-border shadow-md">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Altura de Cultivo</p>
                                            <p className="text-2xl font-bold text-white uppercase mt-1.5">{tvConfig.cafePromocion.altura} <span className="text-sm text-premium-textMuted font-normal">m.s.n.m</span></p>
                                        </div>
                                        <div className="bg-premium-card p-8 rounded-3xl border border-premium-border shadow-md col-span-2 relative overflow-hidden">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest mb-2">Notas de Cata Detectadas</p>
                                            <p className="text-3xl font-black text-premium-gold uppercase tracking-tight relative z-10">{tvConfig.cafePromocion.notas}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* CASO 3: PRESENTACIÓN INDIVIDUAL DE PRODUCTOS EN PANTALLA COMPLETA */}
                        {currentScreen === 'product_focus' && activeProduct && (
                            <div className="w-full h-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-16 items-center justify-center animate-fadeScale">
                                
                                {/* Contenedor de la Imagen */}
                                <div className="lg:col-span-6 flex justify-center relative">
                                    {activeProduct.imageUrl ? (
                                        <div className="w-full max-w-lg aspect-square rounded-[4rem] overflow-hidden shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] border-2 border-premium-border relative bg-premium-card flex items-center justify-center">
                                            {/* Brillo ambiental dorado de fondo si el producto es destacado en pauta */}
                                            {activeProduct.isPromoted && (
                                                <div className="absolute -inset-4 bg-premium-gold/10 rounded-[4rem] blur-3xl animate-pulse"></div>
                                            )}
                                            <img src={activeProduct.imageUrl} className="w-full h-full object-cover relative z-10" alt={activeProduct.name}/>
                                        </div>
                                    ) : (
                                        <div className="w-full max-w-md aspect-square bg-premium-card border-2 border-premium-border rounded-[4rem] flex flex-col items-center justify-center text-9xl shadow-2xl relative">
                                            <span className="relative z-10">{activeProduct.icon || '☕'}</span>
                                            <div className="absolute w-48 h-48 bg-white/5 rounded-full blur-3xl"></div>
                                        </div>
                                    )}
                                </div>

                                {/* Textos informativos de venta */}
                                <div className="lg:col-span-6 text-left space-y-6 flex flex-col justify-center">
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] font-bold text-premium-textMuted uppercase tracking-[0.4em] bg-premium-card px-4 py-1.5 rounded-full border border-premium-border">
                                            {activeProduct.category}
                                        </span>
                                        {activeProduct.isPromoted && (
                                            <span className="text-[9px] font-black text-premium-bg bg-premium-gold px-3 py-1 rounded-full uppercase tracking-widest shadow-md">
                                                Recomendado ⭐
                                            </span>
                                        )}
                                    </div>
                                    
                                    <h2 className="text-6xl font-black text-white tracking-tighter uppercase leading-tight max-w-xl">
                                        {activeProduct.name}
                                    </h2>
                                    
                                    {activeProduct.description && (
                                        <p className="text-lg text-premium-textMuted font-medium leading-relaxed max-w-lg pt-2 border-l-2 border-premium-border pl-4">
                                            {activeProduct.description}
                                        </p>
                                    )}

                                    <div className="pt-6">
                                        <span className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest block mb-1">Precio de Venta</span>
                                        <div className="inline-block text-5xl font-black text-premium-gold tracking-tighter leading-none bg-premium-card border border-premium-border px-8 py-4 rounded-3xl shadow-xl">
                                            <span className="text-3xl font-light mr-1 opacity-70">$</span>
                                            {Number(activeProduct.price).toLocaleString()}
                                        </div>
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* --- FOOTER INFERIOR COMPACTO (SÓLO EL POWERED BY) --- */}
                    <footer className="flex justify-end items-center shrink-0 w-full pt-4">
                        <div className="flex items-center gap-2.5 opacity-40 hover:opacity-100 transition-opacity duration-300">
                            <span className="text-[9px] text-slate-500 font-bold uppercase tracking-[0.2em]">Power By</span>
                            <span className="font-sans font-normal text-slate-400 text-base tracking-tight">Tan<b className="font-bold text-slate-200">Alza</b></span>
                        </div>
                    </footer>

                    {/* --- BOTÓN INICIAR KIOSKO (Manejo de Pantalla Completa y ocultamiento de mouse) --- */}
                    {!isFullscreen && (
                        <button 
                            onClick={handleStartKiosk}
                            className="fixed bottom-6 left-6 z-[999] bg-premium-card hover:bg-black text-white px-6 py-4 rounded-full shadow-2xl font-bold flex items-center gap-3 transition-all transform hover:scale-105 border border-premium-border text-xs tracking-wider uppercase"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            Iniciar Kiosko HD
                        </button>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
