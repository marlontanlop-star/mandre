<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Oficina | Kiosko Digital</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    /* ============================================================
       RESET / BLINDAJE TV
       ============================================================ */
    * {
        box-sizing: border-box !important;
        margin: 0;
        padding: 0;
        -webkit-transform: translate3d(0,0,0);
        transform: translate3d(0,0,0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
    }

    :root{
        /* ---- Paleta NOCHE (default) ---- */
        --bg:      #060B08;   /* negro verdoso profundo, elegante */
        --surface: #0D1510;   /* superficie sutil, casi imperceptible */
        --surface-2:#111C15;
        --line:    rgba(255,255,255,0.07);
        --ink:     #F6FBF7;   /* blanco frío, nítido */
        --mute:    #7E9788;   /* verde grisáceo apagado, solo para labels */
        --accent:  #35E27A;   /* verde vibrante — protagonista */
        --accent-soft: #1E7C4C;
        --paper-shadow: 0 40px 90px rgba(0,0,0,0.6);
        --tv-glow: rgba(53,226,122,0.05);
        --void-fade: rgba(6,11,8,0);
        --img-shadow: drop-shadow(0 30px 60px rgba(0,0,0,0.55));
        --body-copy: #C7D3CB;
        --accent-tint: rgba(53,226,122,0.06);
        --btn-ink: #06110B;
        --theme-transition: background-color .6s ease, color .6s ease, border-color .6s ease, box-shadow .6s ease;
        /* ---- Acento exclusivo Mandre (café del día / marca) ---- */
        --gold:      #E9BA5C;
        --gold-2:    #F4D48A;
        --gold-soft: rgba(233,186,92,0.14);
        --gold-line: rgba(233,186,92,0.42);
        --gold-glow: rgba(233,186,92,0.16);
    }

    /* ---- Paleta DÍA (activada desde el admin: data-theme="light") ---- */
    html[data-theme="light"]{
        --bg:      #F7FAF8;   /* blanco cálido, no puro */
        --surface: #FFFFFF;
        --surface-2:#EEF3EF;
        --line:    rgba(6,20,12,0.09);
        --ink:     #0B1410;   /* casi negro, nítido */
        --mute:    #5B6E62;   /* verde grisáceo, para labels */
        --accent:  #1E7C4C;   /* verde profundo — legible sobre blanco */
        --accent-soft: #35E27A;
        --paper-shadow: 0 40px 90px rgba(20,40,30,0.12);
        --tv-glow: rgba(30,124,76,0.06);
        --void-fade: rgba(247,250,248,0);
        --img-shadow: drop-shadow(0 25px 50px rgba(20,40,30,0.18));
        --body-copy: #3C4A41;
        --accent-tint: rgba(30,124,76,0.08);
        --btn-ink: #F7FAF8;
        --gold:      #B9821F;
        --gold-2:    #D9A63E;
        --gold-soft: rgba(185,130,31,0.10);
        --gold-line: rgba(185,130,31,0.35);
        --gold-glow: rgba(185,130,31,0.10);
    }

    html, body {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        overflow: hidden !important;
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        position: fixed;
        top: 0; left: 0;
        -webkit-user-select: none;
        user-select: none;
        transition: var(--theme-transition);
    }

    #tv-scale-canvas {
        position: absolute;
        width: 1920px;
        height: 1080px;
        top: 50%; left: 50%;
        margin-left: -960px;
        margin-top: -540px;
        overflow: hidden !important;
        -webkit-transform-origin: center center;
        transform-origin: center center;
        display: flex;
        flex-direction: column;
        padding: 70px 110px 44px 110px;
        background:
            radial-gradient(1100px 700px at 88% -8%, var(--tv-glow) 0%, transparent 60%),
            var(--bg);
        transition: var(--theme-transition);
    }

    /* marca de firma — arco fino en vez de anillos topográficos rústicos */
    .signature-mark{
        position:absolute; top:56px; right:78px; width:150px; height:150px;
        z-index: 0; opacity:.9;
        animation: spin-slow 40s linear infinite;
    }
    @keyframes spin-slow{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

    header.log-header{
        position:relative; z-index:3;
        display:flex; align-items:center; justify-content:space-between;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 6px;
    }
    .brand-mark{ display:flex; align-items:center; gap:14px; }
    .brand-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow: 0 0 14px var(--accent); }
    .log-title{
        font-family:'Space Grotesk', sans-serif; font-weight:500;
        font-size: 20px; letter-spacing: 1px; color: var(--ink);
    }
    .log-sub{
        font-family:'IBM Plex Mono', monospace; font-weight:300; font-size: 13px; letter-spacing: 3px;
        text-transform:uppercase; color: var(--mute);
    }

    main {
        position:relative; z-index:3;
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden !important;
    }

    .tv-fade {
        opacity: 0;
        transition: opacity .4s ease-in-out;
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
    }
    .tv-fade-active { opacity: 1; }

    :fullscreen { cursor: none; }
    :-webkit-full-screen { cursor: none; }

    /* ============================================================
       PRIMITIVOS TIPOGRÁFICOS
       ============================================================ */
    .eyebrow{
        font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:15px;
        letter-spacing:4px; text-transform:uppercase; color:var(--accent);
        display:flex; align-items:center; gap:12px;
    }
    .eyebrow .line{ width:28px; height:1px; background:var(--accent); }

    .display-title{
        font-family:'Space Grotesk', sans-serif; font-weight:500;
        color: var(--ink); letter-spacing:-1.5px;
    }

    /* fila delgada: LABEL ———————— VALOR */
    .leader-row{ display:flex; align-items:flex-end; gap:16px; width:100%; }
    .leader-row .lb{
        font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:15px; letter-spacing:3px;
        text-transform:uppercase; color:var(--mute); white-space:nowrap;
    }
    .leader-row .fill{ flex:1; border-bottom:1px solid var(--line); margin-bottom:7px; min-width:30px; }
    .leader-row .val{
        font-family:'IBM Plex Mono', monospace; font-weight:500; color:var(--ink);
        white-space:nowrap; text-align:right;
    }

    .pill{
        font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:13px;
        letter-spacing:2px; text-transform:uppercase; color:var(--accent);
        border:1px solid var(--accent-soft); border-radius:100px; padding:8px 20px;
        display:inline-block; background: var(--accent-tint);
        transition: var(--theme-transition);
    }

    /* ============================================================
       LAYOUT: FICHA DE PRODUCTO / ORIGEN
       ============================================================ */
    .sheet{ display:flex; gap:90px; width:100%; height:100%; align-items:center; }

    .plate-col{ width:640px; height:700px; position:relative; flex-shrink:0; }
    .plate{
        width:100%; height:100%;
        background: transparent;
        border:none;
        box-shadow:none;
        display:flex; align-items:center; justify-content:center;
        position:relative; overflow:visible;
        transition: var(--theme-transition);
    }
    /* halo suave detrás de la imagen: da profundidad sin encajonarla en una tarjeta */
    .plate::before{
        content:""; position:absolute; left:50%; top:50%;
        width:120%; height:120%; transform:translate(-50%,-50%);
        background: radial-gradient(closest-side, var(--tv-glow) 0%, var(--void-fade) 72%);
        z-index:0; pointer-events:none;
    }
    .plate img{
        max-width:88% !important; max-height:88% !important;
        width:auto !important; height:auto !important;
        object-fit:contain !important;
        position:relative; z-index:1;
        filter: var(--img-shadow);
    }
    .plate-placeholder{
        width:72%; height:72%;
        border-radius:50%;
        background: radial-gradient(circle at 35% 30%, var(--surface-2) 0%, var(--bg) 78%);
        border:1px solid var(--line);
        position:relative; z-index:1;
    }
    .plate-tag{
        position:absolute; bottom:24px; left:24px; z-index:3;
        font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:12px; letter-spacing:3px;
        text-transform:uppercase; color:var(--mute);
    }

    .info-col{ flex:1; height:700px; display:flex; flex-direction:column; justify-content:center; }

    .badge-row{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
    .tag-cat{
        font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:14px;
        letter-spacing:3px; text-transform:uppercase; color:var(--mute);
        border:1px solid var(--line); padding:9px 20px; border-radius:100px;
    }

    h2.item-title{ font-size:82px; font-weight:500; line-height:1.02; margin:0 0 20px 0; }

    p.item-desc{
        font-family:'Inter', sans-serif; font-weight:300; font-size:26px; line-height:1.6;
        color:var(--body-copy); margin: 4px 0 36px 0; max-width: 880px;
    }

    .price-row{ margin-top:10px; }
    .price-value{
        font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:60px;
        color: var(--accent); letter-spacing:-1px;
    }
    .price-value .cop{ font-size:22px; color:var(--mute); font-weight:300; margin-right:10px; }

    .fields-grid{ display:flex; gap:1px; margin-top:38px; background:var(--line); }
    .field-card{ flex:1; background:var(--bg); padding:30px 34px; }
    .field-card .lb{ font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:12px; }
    .field-card .vv{ font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:32px; color:var(--ink); }
    .field-card .vv.small{ font-size:20px; font-weight:400; color:var(--accent); }

    .field-card-full{ margin-top:1px; background:var(--bg); padding:32px 34px; }
    .field-card-full .lb{ font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:12px; }
    .field-card-full .vv{ font-family:'Space Grotesk', sans-serif; font-weight:400; font-size:34px; color:var(--accent); line-height:1.3; }

    /* ============================================================
       LAYOUT CENTRADO: BIENVENIDA / FRASE
       ============================================================ */
    .center-layout{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

    .journal-card{
        text-align:center; width:100%; max-width:1300px;
        padding: 20px 60px;
        position:relative;
    }
    .journal-quote{ font-size:58px; font-weight:400; line-height:1.4; color:var(--ink); letter-spacing:-1px; }
    .journal-meta{
        margin-top: 38px; font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:14px;
        letter-spacing:4px; text-transform:uppercase; color:var(--mute);
    }

    .welcome-headline{ font-size:78px; font-weight:500; line-height:1.12; margin:0; letter-spacing:-2px; }

    .hair-divider{ width:64px; height:1px; background:var(--accent); margin:34px auto 0 auto; }

    /* ============================================================
       TARJETA DE UBICACIÓN / AVISO EXPRESS
       ============================================================ */
    .ticket{
        width:100%; max-width:1420px;
        position:relative; padding: 30px 80px; text-align:center;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
    }
    .ticket h2{ font-size:64px; font-weight:500; line-height:1.2; margin: 30px 0 30px 0; letter-spacing:-1.5px; }
    .ticket p.body-copy{
        font-family:'Inter', sans-serif; font-weight:300; font-size:28px; color:var(--body-copy);
        max-width:1150px; margin:0 auto; line-height:1.6;
    }
    .ticket p.body-copy b{ color:var(--accent); font-weight:500; }

    /* footer */
    footer{ position:relative; z-index:3; width:100%; display:flex; justify-content:space-between; align-items:center; padding-top:24px; }
    .footer-brand{ font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); }
    .footer-brand b{ color:var(--accent); font-weight:500; }

    /* ============================================================
       PANTALLA EXCLUSIVA — CAFÉ DEL DÍA / MARCA MANDRE
       Deliberadamente distinta a la ficha de producto: paleta dorada,
       marco circular con anillo giratorio, watermark tipográfico y
       mensaje fijo de trazabilidad + mensaje rotativo.
       ============================================================ */
    .mandre-stage{
        position:relative; width:100%; height:100%;
        display:flex; align-items:center; gap:100px;
        overflow:hidden;
    }
    .mandre-watermark{
        position:absolute; z-index:0; left:-4%; top:50%; transform:translateY(-50%);
        font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:340px;
        letter-spacing:-6px; color:transparent;
        -webkit-text-stroke: 1.4px var(--gold-line);
        opacity:.35; white-space:nowrap; pointer-events:none;
        animation: mandre-drift 26s ease-in-out infinite;
    }
    @keyframes mandre-drift{ 0%,100%{ transform:translateY(-50%) translateX(0);} 50%{ transform:translateY(-50%) translateX(22px);} }

    .mandre-frame-col{ width:640px; height:700px; position:relative; flex-shrink:0; z-index:2; }
    .mandre-frame{
        width:100%; height:100%; border-radius:26px; position:relative;
        display:flex; align-items:center; justify-content:center;
        background: linear-gradient(155deg, var(--gold-soft) 0%, transparent 55%), var(--surface);
        border:1px solid var(--gold-line);
        box-shadow: 0 40px 90px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.02);
        overflow:hidden;
        transition: var(--theme-transition);
    }
    .mandre-frame::before{
        content:""; position:absolute; inset:-2px; border-radius:26px; padding:2px;
        background: conic-gradient(from 0deg, var(--gold), transparent 28%, transparent 72%, var(--gold));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        animation: mandre-spin 9s linear infinite;
        opacity:.8;
    }
    @keyframes mandre-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
    .mandre-frame::after{
        content:""; position:absolute; left:50%; top:50%; width:110%; height:110%;
        transform:translate(-50%,-50%);
        background: radial-gradient(closest-side, var(--gold-glow) 0%, transparent 70%);
        pointer-events:none;
    }
    .mandre-frame img{
        max-width:78% !important; max-height:78% !important;
        width:auto !important; height:auto !important;
        object-fit:contain !important; position:relative; z-index:1;
        filter: drop-shadow(0 25px 50px rgba(0,0,0,0.5));
    }
    .mandre-frame-badge{
        position:absolute; bottom:26px; left:50%; transform:translateX(-50%); z-index:3;
        font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:12px; letter-spacing:3px;
        text-transform:uppercase; color:var(--btn-ink); background:var(--gold);
        padding:9px 20px; border-radius:100px; box-shadow: 0 10px 24px var(--gold-glow);
    }

    .mandre-content{ flex:1; height:700px; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }
    .mandre-eyebrow{
        font-family:'IBM Plex Mono', monospace; font-weight:400; font-size:15px;
        letter-spacing:4px; text-transform:uppercase; color:var(--gold);
        display:flex; align-items:center; gap:12px; margin-bottom:22px;
    }
    .mandre-eyebrow .ln{ width:28px; height:1px; background:var(--gold); }
    .mandre-headline{
        font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:76px; line-height:1.05;
        letter-spacing:-1.5px; color:var(--ink); margin-bottom:26px;
    }
    .mandre-claim{
        font-family:'Inter', sans-serif; font-weight:400; font-size:26px; line-height:1.55;
        color:var(--ink); max-width:880px; margin-bottom:18px;
        padding:22px 28px; border-left:3px solid var(--gold);
        background:var(--gold-soft); border-radius:0 12px 12px 0;
    }
    .mandre-claim b{ color:var(--gold); font-weight:600; }
    .mandre-tagline{
        font-family:'Inter', sans-serif; font-weight:300; font-style:italic; font-size:19px; line-height:1.55;
        color:var(--mute); max-width:820px; margin:0 0 22px 0;
    }
    .mandre-rotating{
        font-family:'Inter', sans-serif; font-weight:300; font-style:italic; font-size:23px; line-height:1.6;
        color:var(--body-copy); max-width:840px; margin-bottom:36px;
        min-height:1.6em;
    }
    .mandre-stats{ display:flex; gap:1px; background:var(--gold-line); margin-top:6px; border-radius:10px; overflow:hidden; }
    .mandre-stat{ flex:1; background:var(--bg); padding:26px 30px; }
    .mandre-stat .lb{ font-family:'IBM Plex Mono', monospace; font-weight:300; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:10px; }
    .mandre-stat .vv{ font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:24px; color:var(--gold-2); }

    .btn-kiosk{
        position: fixed; bottom: 30px; left: 30px; z-index: 999;
        background: var(--accent); color: var(--btn-ink); padding: 16px 32px;
        border-radius: 4px; font-family:'IBM Plex Mono', monospace; font-weight:500; border: none;
        cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        transition: var(--theme-transition);
    }
</style>
</head>
<body>

<div id="tv-scale-canvas">
    <div class="signature-mark" id="signature-mark"></div>

    <header class="log-header">
        <div class="brand-mark">
            <span class="brand-dot"></span>
            <span class="log-title">La Oficina</span>
        </div>
        <span class="log-sub" id="log-clock">Anserma · Caldas</span>
    </header>

    <main id="kiosk-main" class="tv-fade"></main>

    <footer>
        <span class="footer-brand">Specialty Coffee &amp; Wellness</span>
        <span class="footer-brand"> By <b>Mandre</b></span>
    </footer>
</div>

<button id="btn-fullscreen" class="btn-kiosk">Iniciar Kiosko Exterior</button>

<script>
    /* ============================================================
       ESCALA INTELIGENTE DE PANTALLA
       ============================================================ */
    function ajustarEscalaPantallaTV() {
        var canvas = document.getElementById('tv-scale-canvas');
        if (!canvas) return;
        var scaleX = window.innerWidth / 1920;
        var scaleY = window.innerHeight / 1080;
        var scaleFinal = Math.min(scaleX, scaleY);
        canvas.style.transform = 'scale(' + scaleFinal + ')';
        canvas.style.webkitTransform = 'scale(' + scaleFinal + ')';
    }
    window.addEventListener('resize', ajustarEscalaPantallaTV);
    window.addEventListener('load', ajustarEscalaPantallaTV);
    setTimeout(ajustarEscalaPantallaTV, 100);

    /* ============================================================
       MARCA DE FIRMA — arco delgado y minimalista
       ============================================================ */
    function paintSignatureMark(){
        var el = document.getElementById('signature-mark');
        var cs = getComputedStyle(document.documentElement);
        var lineColor = cs.getPropertyValue('--line').trim() || 'rgba(255,255,255,0.06)';
        var accentColor = cs.getPropertyValue('--accent').trim() || '#35E27A';
        el.innerHTML = '<svg viewBox="0 0 150 150" width="100%" height="100%">' +
            '<circle cx="75" cy="75" r="66" fill="none" stroke="' + lineColor + '" stroke-width="1"/>' +
            '<circle cx="75" cy="75" r="66" fill="none" stroke="' + accentColor + '" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="90 320"/>' +
            '<circle cx="75" cy="75" r="40" fill="none" stroke="' + lineColor + '" stroke-width="1"/>' +
            '</svg>';
    }
    paintSignatureMark();
    window.paintSignatureMark = paintSignatureMark;

    /* reloj sutil del encabezado */
    (function tickClock(){
        var el = document.getElementById('log-clock');
        function paint(){
            var d = new Date();
            var hh = String(d.getHours()).padStart(2,'0');
            var mm = String(d.getMinutes()).padStart(2,'0');
            el.textContent = 'Anserma · Caldas · ' + hh + ':' + mm;
        }
        paint();
        setInterval(paint, 15000);
    })();

    /* ============================================================
       CONEXIÓN A LA BASE DE DATOS (Firebase — sin modificar)
       ============================================================ */
    const firebaseConfig = {
        apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
        authDomain: "mandre-f9e43.firebaseapp.com",
        projectId: "mandre-f9e43",
        storageBucket: "mandre-f9e43.firebasestorage.app",
        messagingSenderId: "865403538422",
        appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let dataset = { products: [], config: null };

    let loopState = {
        currentPhase: 'welcome',
        productIndex: 0,
        secondsCounter: 0,
        productsShownInSession: 0,
        phraseIndex: 0,
        ubicacionIndex: 0,
        promoToggle: false,
        marcaCafeIndex: 0,
        specialRotation: 0
    };

    const localPhrases = [
        "En La Oficina no servimos café: seleccionamos altitudes, notas y orígenes en cada taza.",
        "Cada lote que catamos viene de una vereda distinta de Anserma, Caldas. Pregúntanos por el de hoy.",
        "Un espacio abierto, una taza caliente. Anserma también se disfruta despacio.",
        "Bienestar y especialidad en el mismo lugar: así entendemos el café en La Oficina.",
        "De la montaña a la taza: cuidamos cada paso del proceso para que lo sientas."
    ];

    // Mensajes rotativos exclusivos de la pantalla "Café del día / Marca Mandre"
    const cafeMandreMessages = [
        "Desde el espresso hasta el frappé, cada bebida de café que preparamos sale de este mismo lote.",
        "No mezclamos marcas: si lleva café, lleva Café Mandre. Sin excepciones, sin atajos.",
        "El grano que ves aquí es el mismo que muele nuestro barista para tu bebida de hoy.",
        "Un solo origen, una sola marca, todas las tazas: así garantizamos consistencia en cada preparación.",
        "Café Mandre no es un ingrediente más: es la base de toda nuestra carta de café."
    ];

    // Mensajes rotativos sobre dónde estamos — reemplazan la promo de fútbol
    const ansermaMessages = [
        {
            eyebrow: "Anserma, la Abuela de Caldas",
            titulo: "Estás en el corazón de Anserma",
            texto: "Entre montañas y trapiches, Anserma guarda una de las tradiciones cafeteras más antiguas de Caldas. La Oficina nace de ese mismo suelo."
        },
        {
            eyebrow: "Origen verificado",
            titulo: "Café que no viaja lejos para llegar a tu taza",
            texto: "Nuestros lotes vienen de veredas a menos de una hora de aquí. Cultivo, trilla y tueste, todo dentro de Anserma, Caldas."
        },
        {
            eyebrow: "Anserma, Caldas",
            titulo: "Un pueblo pequeño, un café enorme",
            texto: "A más de 1700 metros sobre el nivel del mar, el clima de Anserma le da a cada grano una acidez y un dulzor que se sienten distintos."
        },
        {
            eyebrow: "Encuéntranos aquí",
            titulo: "La Oficina, tu parada obligada en Anserma",
            texto: "Si estás de paso por Anserma, en el occidente de Caldas, este es el lugar para sentarte, respirar y probar café de especialidad de verdad."
        }
    ];

    /* ============================================================
       PALETA DÍA / NOCHE (controlada desde el admin)
       ============================================================
       El admin escribirá un booleano en configuracionTV/actual.
       Campo esperado: modoDia -> true = fondo blanco (día)
                                   false/ausente = fondo negro (noche, default)
       Si el admin usa otro nombre de campo, se soportan alias comunes.
    */
    function esModoDia(cfg){
        if (!cfg) return false;
        if (typeof cfg.modoDia === 'boolean') return cfg.modoDia;
        if (typeof cfg.temaClaro === 'boolean') return cfg.temaClaro;
        if (typeof cfg.fondoBlanco === 'boolean') return cfg.fondoBlanco;
        if (typeof cfg.pantallaDia === 'boolean') return cfg.pantallaDia;
        return false;
    }

    function aplicarTema(cfg){
        var esDia = esModoDia(cfg);
        document.documentElement.setAttribute('data-theme', esDia ? 'light' : 'dark');
        if (window.paintSignatureMark) window.paintSignatureMark();
    }

    const kioskMain = document.getElementById('kiosk-main');

    // Escuchar Inventario
    db.collection('inventory').onSnapshot(function(snap){
        let items = [];
        snap.forEach(function(doc){
            let p = doc.data();
            if (p.showOnTv !== false) items.push(p);
        });
        dataset.products = items.sort(function(a,b){
            return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
        });
        if (loopState.currentPhase === 'product_focus' && (!dataset.config || !dataset.config.pautaExpressActiva)) {
            renderCurrentScreen();
        }
    });

    // Escuchar Configuración TV
    db.collection('configuracionTV').doc('actual').onSnapshot(function(doc){
        if (doc.exists) {
            dataset.config = doc.data();
            aplicarTema(dataset.config);
            renderCurrentScreen();
        }
    });

    window.handleImageError = function(imageElement){
        if (imageElement && imageElement.parentElement) {
            imageElement.parentElement.innerHTML = '<div class="plate-placeholder"></div>';
        }
    };

    function money(v){
        return '<span class="cop">$COP</span>' + Number(v || 0).toLocaleString('es-CO');
    }

    function sampleTag(n){
        return '№ ' + String(n).padStart(3, '0');
    }

    /* ============================================================
       PLANTILLAS DE PANTALLA
       ============================================================ */
    function tplExpress(cfg){
        let titulo = cfg.pautaExpressTitulo || "ANUNCIO ESPECIAL";
        let texto = cfg.pautaExpressTexto || "Promoción exclusiva disponible ahora.";
        return `
            <div class="center-layout">
                <div class="ticket">
                    <span class="pill">Destacado de la semana</span>
                    <h2 class="display-title" style="color:var(--accent);">${titulo}</h2>
                    <p class="body-copy">${texto}</p>
                    <p class="footer-brand" style="margin-top:34px;">La Oficina Anserma · Sabores de Temporada</p>
                </div>
            </div>`;
    }

    function tplWelcome(cfg){
        let texto = (cfg && cfg.publicidadRecurrente) ? cfg.publicidadRecurrente.textoConfigurable : "Bienvenidos a una experiencia exclusiva";
        return `
            <div class="center-layout">
                <div style="text-align:center; max-width:1300px;">
                    <span class="eyebrow" style="justify-content:center;"><span class="line"></span>Recomendación<span class="line"></span></span>
                    <h2 class="display-title welcome-headline" style="margin-top:26px;">${texto}</h2>
                    <div class="hair-divider"></div>
                </div>
            </div>`;
    }

    function tplMarcaCafe(cafe, rotIdx){
        let img = cafe.logoUrl || cafe.logourl || cafe.imageUrl || cafe.imageurl || "";
        let plate = (img && img.length > 10)
            ? `<img src="${img}" onerror="window.handleImageError(this)"/>`
            : `<div class="plate-placeholder"></div>`;
        let municipio = cafe.municipio || 'Anserma';
        let departamento = cafe.departamento || 'Caldas';
        let mensajeRotativo = cafeMandreMessages[rotIdx % cafeMandreMessages.length];
        let mensajeBolsa = cafe.mensaje ? `<p class="mandre-tagline">"${cafe.mensaje}"</p>` : '';
        return `
            <div class="mandre-stage">
                <span class="mandre-watermark">Mandre</span>
                <div class="mandre-frame-col">
                    <div class="mandre-frame">${plate}</div>
                    <span class="mandre-frame-badge">Café del Grupo Mandre</span>
                </div>
                <div class="mandre-content">
                    <span class="mandre-eyebrow"><span class="ln"></span>Café del día<span class="ln"></span></span>
                    <h2 class="mandre-headline">El café detrás de cada taza</h2>
                    <p class="mandre-claim">Todas nuestras bebidas a base de café están preparadas con <b>Café Mandre</b>, cultivado en ${municipio}, ${departamento}.</p>
                    ${mensajeBolsa}
                    <p class="mandre-rotating">${mensajeRotativo}</p>
                    <div class="mandre-stats">
                        <div class="mandre-stat">
                            <span class="lb">Procedencia</span>
                            <span class="vv">${municipio} · ${departamento}</span>
                        </div>
                        <div class="mandre-stat">
                            <span class="lb">Elaborado por</span>
                            <span class="vv">Grupo Mandre</span>
                        </div>
                    </div>
                </div>
            </div>`;
    }

    function tplProduct(prod, idx){
        let stamp = prod.isPromoted ? `<span class="pill" style="margin-left:14px;">Favorito del barista</span>` : '';
        let desc = prod.description ? `<p class="item-desc">${prod.description}</p>` : '';
        let link = prod.imageUrl || prod.imageurl || prod.image || prod.url || "";
        let plate = (link && link.length > 10)
            ? `<img src="${link}" onerror="window.handleImageError(this)"/>`
            : `<div class="plate-placeholder"></div>`;
        return `
            <div class="sheet">
                <div class="plate-col">
                    <div class="plate">${plate}</div>
                    <span class="plate-tag">${sampleTag(idx + 1)}</span>
                </div>
                <div class="info-col">
                    <div class="badge-row">
                        <span class="tag-cat">${prod.category || 'Menú'}</span>
                        ${stamp}
                    </div>
                    <h2 class="display-title item-title">${prod.name || ''}</h2>
                    ${desc}
                    <div class="leader-row" style="max-width:600px; margin-bottom:14px;">
                        <span class="lb">Precio</span>
                        <span class="fill"></span>
                    </div>
                    <div class="price-row"><span class="price-value">${money(prod.price)}</span></div>
                </div>
            </div>`;
    }

    function tplJournal(frase, idx, total){
        return `
            <div class="center-layout">
                <div class="journal-card">
                    <span class="eyebrow" style="justify-content:center;"><span class="line"></span>La Oficina Anserma<span class="line"></span></span>
                    <p class="display-title journal-quote" style="margin-top:30px; font-weight:400;">${frase}</p>
                    <p class="journal-meta">${idx + 1} / ${total} · Specialty Coffee &amp; Wellness</p>
                </div>
            </div>`;
    }

    function tplUbicacion(item, idx, total){
        return `
            <div class="center-layout">
                <div class="ticket">
                    <span class="pill">📍 ${item.eyebrow}</span>
                    <h2 class="display-title">${item.titulo}</h2>
                    <p class="body-copy">${item.texto}</p>
                    <p class="journal-meta" style="margin-top:30px;">${idx + 1} / ${total} · Anserma, Caldas</p>
                </div>
            </div>`;
    }

    /* ============================================================
       MOTOR DE RENDER
       ============================================================ */
    function renderCurrentScreen(){
        kioskMain.classList.remove('tv-fade-active');

        setTimeout(function(){
            let html = '';

            if (dataset.config && dataset.config.pautaExpressActiva === true) {
                html = tplExpress(dataset.config);
                kioskMain.innerHTML = html;
                kioskMain.classList.add('tv-fade-active');
                ajustarEscalaPantallaTV();
                return;
            }

            if (loopState.currentPhase === 'welcome') {
                html = tplWelcome(dataset.config);
            }
            else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                html = tplMarcaCafe(dataset.config.cafePromocion, loopState.marcaCafeIndex);
            }
            else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                let prod = dataset.products[loopState.productIndex];
                if (prod) html = tplProduct(prod, loopState.productIndex);
            }
            else if (loopState.currentPhase === 'local_phrase') {
                html = tplJournal(localPhrases[loopState.phraseIndex], loopState.phraseIndex, localPhrases.length);
            }
            else if (loopState.currentPhase === 'ubicacion_anserma') {
                html = tplUbicacion(ansermaMessages[loopState.ubicacionIndex], loopState.ubicacionIndex, ansermaMessages.length);
            }

            kioskMain.innerHTML = html;
            kioskMain.classList.add('tv-fade-active');
            ajustarEscalaPantallaTV();
        }, 50);
    }

    /* ============================================================
       MOTOR DE TIEMPOS (misma cadencia funcional del kiosko original)
       ============================================================ */
    setInterval(function(){
        if (dataset.config && dataset.config.pautaExpressActiva === true) return;

        loopState.secondsCounter++;

        if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
            if (dataset.config && dataset.config.cafePromocion) loopState.currentPhase = 'cafe_dia';
            else if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; }
            loopState.secondsCounter = 0; renderCurrentScreen();
        }
        // La pantalla Café Mandre permanece más tiempo en escena (18s) que cualquier otra plantilla del ciclo
        else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 18) {
            loopState.marcaCafeIndex = (loopState.marcaCafeIndex + 1) % cafeMandreMessages.length;
            if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; }
            else loopState.currentPhase = 'welcome';
            loopState.secondsCounter = 0; renderCurrentScreen();
        }
        else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
            loopState.secondsCounter = 0;
            loopState.productsShownInSession++;

            // Cada 4 productos se muestra siempre la pantalla exclusiva Café Mandre.
            // Si aún no hay café configurado en el admin, se cae de respaldo a las
            // pantallas de ubicación / frase local (alternadas) para no dejar el
            // kiosko sin contenido especial.
            if (loopState.productsShownInSession >= 4) {
                loopState.productsShownInSession = 0;
                var haySplashCafe = !!(dataset.config && dataset.config.cafePromocion);
                if (haySplashCafe) {
                    loopState.currentPhase = 'cafe_dia';
                } else if (!loopState.promoToggle) {
                    loopState.currentPhase = 'ubicacion_anserma'; loopState.promoToggle = true;
                } else {
                    loopState.currentPhase = 'local_phrase'; loopState.promoToggle = false;
                }
                renderCurrentScreen();
            } else {
                if (loopState.productIndex + 1 < dataset.products.length) { loopState.productIndex++; renderCurrentScreen(); }
                else { loopState.currentPhase = 'welcome'; loopState.productIndex = 0; renderCurrentScreen(); }
            }
        }
        else if (loopState.currentPhase === 'ubicacion_anserma' && loopState.secondsCounter >= 10) {
            loopState.secondsCounter = 0;
            loopState.ubicacionIndex = (loopState.ubicacionIndex + 1) % ansermaMessages.length;
            if (loopState.productIndex + 1 < dataset.products.length) { loopState.productIndex++; loopState.currentPhase = 'product_focus'; }
            else { loopState.currentPhase = 'welcome'; loopState.productIndex = 0; }
            renderCurrentScreen();
        }
        else if (loopState.currentPhase === 'local_phrase' && loopState.secondsCounter >= 8) {
            loopState.secondsCounter = 0;
            loopState.phraseIndex = (loopState.phraseIndex + 1) % localPhrases.length;
            if (loopState.productIndex + 1 < dataset.products.length) { loopState.productIndex++; loopState.currentPhase = 'product_focus'; }
            else { loopState.currentPhase = 'welcome'; loopState.productIndex = 0; }
            renderCurrentScreen();
        }
    }, 1000);

    renderCurrentScreen();

    /* ============================================================
       PANTALLA COMPLETA NATIVA
       ============================================================ */
    const btnFullscreen = document.getElementById('btn-fullscreen');
    btnFullscreen.addEventListener('click', function(){
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    });

    function checkFullscreen(){
        if (document.fullscreenElement || document.webkitFullscreenElement) btnFullscreen.style.display = 'none';
        else btnFullscreen.style.display = 'block';
        setTimeout(ajustarEscalaPantallaTV, 150);
    }
    document.addEventListener('fullscreenchange', checkFullscreen);
    document.addEventListener('webkitfullscreenchange', checkFullscreen);
</script>
</body>
</html>
