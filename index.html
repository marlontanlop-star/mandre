<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital Exterior | LA OFICINA Anserma</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- DISEÑO PREMIUM DE IMAGEN INFINITA PARA EXTERIORES --- */
        * {
            box-sizing: border-box;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #FFFFFF; /* Blanco puro anti-reflejos */
            color: #111111; 
            overflow: hidden; 
            margin: 0;
            padding: 3% 5%;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-user-select: none;
            user-select: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: auto 0;
        }

        /* Transición de opacidad nativa de webOS */
        .tv-fade {
            opacity: 0;
            -webkit-transition: opacity 0.3s ease-in-out;
            transition: opacity 0.3s ease-in-out;
        }
        .tv-fade-active {
            opacity: 1;
        }

        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }

        /* Estilos de Alto Impacto Limpios (Sin marcos negros) */
        .text-accent { color: #8C6239; } 
        .text-dark { color: #000000; }
        .text-muted { color: #666666; font-weight: 700; }
        
        /* Layout de Rejilla para TV */
        .grid-layout {
            display: -webkit-box;
            display: flex;
            width: 100%;
            max-width: 1400px;
            align-items: center;
            justify-content: center;
        }
        .grid-col-left { width: 45%; display: flex; justify-content: center; }
        .grid-col-right { width: 55%; padding-left: 6%; text-align: left; }

        /* Contenedor de Imagen Infinita (Más grande, sin bordes oscuros) */
        .image-container {
            width: 540px;
            height: 540px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 35px 70px rgba(0,0,0,0.06); /* Sombra ultra suave para despegar del fondo */
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* En caso de que falle la carga, se muestra este contenedor alternativo LIMPIO */
        .image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            border-radius: 40px;
        }

        /* Badges estilizados sin contornos pesados */
        .badge {
            display: inline-block;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .badge-muted { background-color: #F1F3F5; color: #495057; }
        .badge-accent { background-color: #8C6239; color: #FFFFFF; margin-left: 10px; }

        /* Bloque de Precio Gigante y Flotante (Sin bordes rígidos) */
        .price-box {
            display: inline-block;
            font-size: 72px;
            font-weight: 900;
            color: #000000;
            background-color: #F8F9FA;
            padding: 10px 35px;
            border-radius: 24px;
            margin-top: 15px;
            letter-spacing: -3px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        /* Paneles limpios para el Café del Día */
        .cafe-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .cafe-card { background: #F8F9FA; padding: 20px 24px; border-radius: 24px; flex: 1; min-width: 45%; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .cafe-card-full { width: 100%; background: #F8F9FA; padding: 24px; border-radius: 24px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }

        /* Contenedor Limpio para el Banco de Frases */
        .phrase-container {
            text-align: center;
            max-width: 1100px;
            padding: 50px;
            background-color: #FFFDF9;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(140,98,57,0.04);
        }

        /* Footer y Botones de control */
        footer { width: 100%; display: flex; justify-content: flex-end; opacity: 0.6; }
        .footer-brand { font-size: 13px; color: #111111; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        .footer-brand b { color: #8C6239; font-weight: 900; }

        .btn-kiosk {
            position: fixed; bottom: 25px; left: 25px; z-index: 999;
            background: #111111; color: white; padding: 14px 28px;
            border-radius: 30px; font-weight: 900; border: none;
            cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <main id="kiosk-main" class="tv-fade">
        </main>

    <footer>
        <div class="footer-brand">
            Power By <span>Tan<b>Alza</b></span>
        </div>
    </footer>

    <button id="btn-fullscreen" class="btn-kiosk">
        Iniciar Kiosko Exterior
    </button>

    <script>
        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Estructuras en memoria RAM
        let dataset = { products: [], config: null };
        
        let loopState = { 
            currentPhase: 'welcome', 
            productIndex: 0, 
            secondsCounter: 0,
            productsShownInSession: 0, 
            phraseIndex: 0
        };

        // Banco de Frases de La Oficina en Anserma, Caldas
        const localPhrases = [
            "El mejor punto de encuentro en la 'Abuela de Caldas'. ¡Ven a La Oficina por tu dosis de bienestar!",
            "Café de especialidad cultivado en nuestras montañas caldenses, servido con orgullo en Anserma.",
            "¿Trabajo, amigos o un respiro? El espacio ideal para conectar y recargar tus energías está en La Oficina.",
            "Pasión por los detalles, amor por el origen. Vive la verdadera cultura cafetera en el corazón de Anserma.",
            "Mucho más que una taza de café. Creamos experiencias premium de Specialty Coffee & Wellness para ti."
        ];

        const kioskMain = document.getElementById('kiosk-main');

        // Escucha Firebase: Inventario
        db.collection('inventory').onSnapshot(function(snap) {
            let items = [];
            snap.forEach(function(doc) {
                items.push(doc.data());
            });
            dataset.products = items.sort(function(a, b) {
                return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
            });
            if(loopState.currentPhase === 'product_focus') renderCurrentScreen();
        });

        // Escucha Firebase: Configuración TV
        db.collection('configuracionTV').doc('actual').onSnapshot(function(doc) {
            if (doc.exists) {
                dataset.config = doc.data();
                if(loopState.currentPhase === 'welcome' || loopState.currentPhase === 'cafe_dia') renderCurrentScreen();
            }
        });

        // --- MANEJO DE CAÍDAS DE IMAGEN SIN ENLACES RAROS ---
        window.handleImageError = function(imageElement) {
            // Reemplaza el nodo completo de la imagen por un contenedor vacío gris premium, eliminando el texto o emojis incidentales
            if(imageElement && imageElement.parentElement) {
                imageElement.parentElement.innerHTML = '<div class="image-placeholder"></div>';
            }
        };

        // --- MOTOR RENDER RESTRUCTURADO (VANILLA JS) ---
        function renderCurrentScreen() {
            kioskMain.classList.remove('tv-fade-active');
            
            setTimeout(function() {
                let html = '';

                // 1. BIENVENIDA / ANUNCIO
                if (loopState.currentPhase === 'welcome') {
                    let texto = (dataset.config && dataset.config.publicidadRecurrente) ? dataset.config.publicidadRecurrente.textoConfigurable : "Bienvenidos a una experiencia exclusiva";
                    html = `
                        <div style="text-align: center; max-width: 1000px;">
                            <span class="text-accent" style="font-size: 16px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; display: block; margin-bottom: 25px;">Recomendación Especial</span>
                            <h2 style="font-size: 72px; font-weight: 900; line-height: 1.1; text-transform: uppercase; color: #000000; letter-spacing: -2px; margin: 0;">${texto}</h2>
                            <div style="width: 140px; height: 4px; background-color: #8C6239; margin: 35px auto 0 auto;"></div>
                        </div>
                    `;
                }
                
                // 2. CAFÉ DE ORIGEN
                else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                    let cafe = dataset.config.cafePromocion;
                    
                    let cafeImg = cafe.logoUrl || cafe.logourl || cafe.imageUrl || cafe.imageurl || "";
                    let imgSection = (cafeImg && cafeImg.length > 10)
                        ? `<div class="image-container"><img src="${cafeImg}" onerror="window.handleImageError(this)" /></div>`
                        : `<div class="image-container"><div class="image-placeholder"></div></div>`;
                    
                    html = `
                        <div class="grid-layout">
                            <div class="grid-col-left">${imgSection}</div>
                            <div class="grid-col-right">
                                <div class="badge badge-accent" style="margin-left: 0;">FILTRADO HOY</div>
                                <h2 style="font-size: 68px; font-weight: 900; letter-spacing: -3px; margin: 0 0 15px 0; line-height: 1; color:#000;">CAFÉ DE ORIGEN</h2>
                                <div class="cafe-grid">
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Procedencia</p>
                                        <p style="font-size: 28px; font-weight: 900; text-transform: uppercase; margin: 5px 0 0 0; color:#000;">${cafe.municipio || ''}</p>
                                        <p class="text-accent" style="font-size: 16px; font-weight: 900; text-transform: uppercase; margin: 2px 0 0 0;">${cafe.vereda || ''}</p>
                                    </div>
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Altura Cultivo</p>
                                        <p style="font-size: 28px; font-weight: 900; text-transform: uppercase; margin: 5px 0 0 0; color:#000;">${cafe.altura || ''} <span style="font-size: 16px; font-weight: 700; color:#666;">m.s.n.m</span></p>
                                    </div>
                                </div>
                                <div class="cafe-card-full">
                                    <p class="text-muted" style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 5px 0;">Notas de Cata Detectadas</p>
                                    <p class="text-accent" style="font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0;">${cafe.notas || ''}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // 3. PRODUCTO INDIVIDUAL (IMAGEN INFINITA SIN ERRORES NI EMOJIS ADYACENTES)
                else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                    let prod = dataset.products[loopState.productIndex];
                    if (prod) {
                        let badgeDestacado = prod.isPromoted ? `<span class="badge badge-accent">Recomendado ⭐</span>` : '';
                        let descripcionHtml = prod.description ? `<p class="text-dark" style="font-size: 22px; font-weight: 700; line-height: 1.4; margin: 20px 0; border-left: 4px solid #8C6239; padding-left: 20px;">${prod.description}</p>` : '';
                        
                        let linkFoto = prod.imageUrl || prod.imageurl || prod.image || prod.url || "";
                        let imgSection = "";

                        // Validación definitiva de imagen
                        if (linkFoto && linkFoto.length > 10) {
                            // Se inyecta la foto limpia. Si falla, el callback nativo la transforma en placeholder plano, jamás en emoji
                            imgSection = `<div class="image-container"><img src="${linkFoto}" onerror="window.handleImageError(this)"/></div>`;
                        } else {
                            imgSection = `<div class="image-container"><div class="image-placeholder"></div></div>`;
                        }

                        html = `
                            <div class="grid-layout">
                                <div class="grid-col-left">${imgSection}</div>
                                <div class="grid-col-right">
                                    <div style="display: flex; align-items: center;">
                                        <span class="badge badge-muted">${prod.category}</span>
                                        ${badgeDestacado}
                                    </div>
                                    <h2 style="font-size: 68px; font-weight: 900; letter-spacing: -2px; text-transform: uppercase; margin: 0; line-height: 1.1; color:#000;">${prod.name}</h2>
                                    ${descripcionHtml}
                                    <div style="margin-top: 20px;">
                                        <span class="text-muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom:5px;">Precio de Venta</span>
                                        <div class="price-box"><span style="font-size: 36px; font-weight: 400; margin-right: 5px; color:#555;">$</span>${Number(prod.price).toLocaleString()}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                // 4. BANCO DE FRASES
                else if (loopState.currentPhase === 'local_phrase') {
                    let fraseActual = localPhrases[loopState.phraseIndex];
                    html = `
                        <div class="phrase-container">
                            <span class="text-accent" style="font-size: 16px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; display: block; margin-bottom: 25px;">La Oficina Anserma</span>
                            <h2 style="font-size: 52px; font-weight: 900; line-height: 1.3; color: #000000; margin: 0; letter-spacing:-1px;">"${fraseActual}"</h2>
                            <p class="text-muted" style="font-size: 14px; margin-top: 30px; letter-spacing: 3px; text-transform: uppercase;">Specialty Coffee & Wellness • Caldas</p>
                        </div>
                    `;
                }

                kioskMain.innerHTML = html;
                kioskMain.classList.add('tv-fade-active');
            }, 50); 
        }

        // --- MANEJO DE TIEMPOS ---
        setInterval(function() {
            loopState.secondsCounter++;

            if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
                if (dataset.config && dataset.config.cafePromocion) {
                    loopState.currentPhase = 'cafe_dia';
                } else if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 10) {
                if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                } else {
                    loopState.currentPhase = 'welcome';
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
                loopState.secondsCounter = 0;
                loopState.productsShownInSession++; 

                if (loopState.productsShownInSession >= 4) {
                    loopState.productsShownInSession = 0; 
                    loopState.currentPhase = 'local_phrase';
                    renderCurrentScreen();
                } else {
                    if (loopState.productIndex + 1 < dataset.products.length) {
                        loopState.productIndex++;
                        renderCurrentScreen();
                    } else {
                        loopState.currentPhase = 'welcome';
                        loopState.productIndex = 0;
                        renderCurrentScreen();
                    }
                }
            }
            else if (loopState.currentPhase === 'local_phrase' && loopState.secondsCounter >= 8) {
                loopState.secondsCounter = 0;
                loopState.phraseIndex = (loopState.phraseIndex + 1) % localPhrases.length;

                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++;
                    loopState.currentPhase = 'product_focus';
                } else {
                    loopState.currentPhase = 'welcome';
                    loopState.productIndex = 0;
                }
                renderCurrentScreen();
            }
        }, 1000);

        renderCurrentScreen();

        // --- PANTALLA COMPLETA NATIVA ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        
        btnFullscreen.addEventListener('click', function() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        });

        function checkFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                btnFullscreen.style.display = 'none';
            } else {
                btnFullscreen.style.display = 'block';
            }
        }

        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
    </script>
</body>
</html>
