<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIENVENIDOS | LA OFICINA</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Gama de verdes para reemplazar el rosado */
            --oficina-primario: #2e7d32; /* Verde principal para acentos y badges */
            --oficina-suave: #e8f5e9;    /* Verde muy claro para el fondo */
            --oficina-dark: #1b5e20;     /* Verde oscuro para el texto y elementos oscuros */
            --oficina-destacado: #a5d6a7; /* Verde claro para destacar texto en fondo oscuro */
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: var(--oficina-dark); 
            font-family: 'Montserrat', sans-serif; height: 100vh;
        }

        .bg-pattern {
            background-color: var(--oficina-suave);
            background-image: radial-gradient(var(--oficina-primario) 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            display: flex; height: 100vh; width: 100vw;
        }

        .tv-container {
            width: 50vw; height: 100vh; padding: 5vh 4vw;
            display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box;
        }

        .price-tag { 
            color: var(--oficina-primario); font-weight: 900; font-size: 7.5vw;
        }

        .category-badge {
            background-color: var(--oficina-primario); color: white;
            padding: 0.5vh 1.5vw; border-radius: 8px;
            font-size: 1.4vw; font-weight: bold; text-transform: uppercase;
        }

        .image-side { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .image-side img { width: 100%; height: 100%; object-fit: cover; }
        
        .slide-enter { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hidden { display: none !important; }
        .flex { display: flex !important; }
    </style>
</head>
<body>

    <div id="view-start" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--oficina-dark); color: white; text-align: center;">
        <h1 style="font-size: 6vw; font-weight: 900; color: var(--oficina-destacado);">¡EL MEJOR LUGAR <br>EN ANSERMA!</h1>
        <button onclick="iniciar()" style="background: var(--oficina-primario); color: white; padding: 2vh 5vw; border-radius: 50px; border: 4px solid white; font-weight: 900; font-size: 1.8vw; cursor: pointer; margin-top: 20px;">INICIAR KIOSCO</button>
    </div>

    <div id="view-main" class="hidden bg-pattern">
        <div class="tv-container">
            <div><span id="ui-cat" class="category-badge">RECOMENDADO</span></div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <h1 id="ui-name" style="line-height: 0.9; font-weight: 900; text-transform: uppercase;">PRODUCTO</h1>
                <p id="ui-desc" style="font-size: 2.2vw; font-weight: 700; color: var(--oficina-primario); margin-top: 2vh;">Cargando...</p>
            </div>
            <div>
                <div id="ui-price" class="price-tag">$0</div>
                <div style="display: flex; align-items: center; gap: 2vw; border-top: 0.3vw solid var(--oficina-primario); padding-top: 3vh;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://instagram.com/laoficinaanserma" style="width: 7vw; height: 7vw; background: white; padding: 5px; border-radius: 10px;">
                    <div>
                        <p style="font-size: 1.1vw; font-weight: 700; opacity: 0.6; color: var(--oficina-dark); margin: 0;">Escanea y conoce más</p>
                        <p style="font-size: 2.2vw; font-weight: 900; color: var(--oficina-primario); margin: 0;">@laoficinaanserma</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="image-side">
            <img id="ui-img" class="slide-enter" src="">
        </div>
    </div>

    <div id="view-message" class="hidden" style="height: 100vh; width: 100vw; background: var(--oficina-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white;">
        <h2 style="font-size: 7vw; font-weight: 900; color: var(--oficina-destacado); line-height: 1; margin: 0;">LA OFICINA</h2>
        <div id="ui-msg-container" style="min-height: 15vh; display: flex; align-items: center; justify-content: center; width: 80%;">
            <p id="ui-msg-text" style="font-size: 3.5vw; color: white; font-weight: 700; margin-top: 3vh; line-height: 1.2;">
                Ven a La Oficina, el mejor lugar en Anserma, Caldas.
            </p>
        </div>
        <div style="margin-top: 5vh; border: 2px solid var(--oficina-primario); padding: 2vh 4vw; border-radius: 20px;">
            <p style="font-size: 1.5vw; color: var(--oficina-primario); font-weight: 900; margin: 0;">EL MEJOR PARCHE DE ANSERMA, CALDAS</p>
        </div>
    </div>

    <script>
        var displaySequence = [];
        var currentIndex = 0;
        var loopInterval = null;
        var allDocs = [];

        // Frases actualizadas para la invitación general
        var frasesOficina = [
            "Ven a La Oficina, el mejor lugar en Anserma, Caldas.",
            "El mejor ambiente para compartir con amigos.",
            "Tu lugar favorito para un buen café y el mejor parche.",
            "Calidad y sabor en cada detalle.",
            "Donde las mejores historias comienzan.",
            "¡Te esperamos en el corazón de Anserma!"
        ];
        var fraseIndex = 0;

        function iniciar() {
            try {
                var doc = document.documentElement;
                if (doc.requestFullscreen) doc.requestFullscreen();
            } catch (e) {}
            
            document.getElementById('view-start').classList.add('hidden');
            loadData(""); 
        }

        function loadData(pageToken) {
            var xhr = new XMLHttpRequest();
            var url = "https://firestore.googleapis.com/v1/projects/mandre-f9e43/databases/(default)/documents/inventory?pageSize=300";
            if (pageToken) url += "&pageToken=" + pageToken;
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    if (data.documents) allDocs = allDocs.concat(data.documents);
                    if (data.nextPageToken) loadData(data.nextPageToken);
                    else procesarInventario();
                }
            };
            xhr.send();
        }

        function procesarInventario() {
            var products = [];
            for (var i = 0; i < allDocs.length; i++) {
                var f = allDocs[i].fields;
                var isPromoted = f && f.isPromoted && (f.isPromoted.booleanValue === true || f.isPromoted.stringValue === "true");
                var imageUrl = f && (f.imageUrl ? f.imageUrl.stringValue : (f.imagen ? f.imagen.stringValue : null));
                
                if (isPromoted && imageUrl) {
                    products.push({
                        isMessage: false,
                        name: f.name ? f.name.stringValue : "RECOMENDADO",
                        price: Number(f.price ? (f.price.integerValue || f.price.doubleValue || f.price.stringValue || 0) : 0),
                        desc: f.description ? f.description.stringValue : "",
                        img: imageUrl,
                        cat: f.category ? f.category.stringValue : "LA OFICINA"
                    });
                }
            }

            displaySequence = [];
            for (var j = 0; j < products.length; j++) {
                displaySequence.push(products[j]);
                if ((j + 1) % 2 === 0) {
                    displaySequence.push({ isMessage: true });
                }
            }
            if (products.length % 2 !== 0) displaySequence.push({ isMessage: true });

            if (displaySequence.length > 0) {
                render();
                if (loopInterval) clearInterval(loopInterval);
                loopInterval = setInterval(function() {
                    currentIndex = (currentIndex + 1) % displaySequence.length;
                    render();
                }, 8000);
            }
        }

        function render() {
            var data = displaySequence[currentIndex];
            var vMain = document.getElementById('view-main');
            var vMsg = document.getElementById('view-message');
            
            if (data.isMessage) {
                vMain.classList.add('hidden');
                vMain.classList.remove('flex');
                vMsg.classList.remove('hidden');
                vMsg.classList.add('flex');
                
                document.getElementById('ui-msg-text').innerHTML = frasesOficina[fraseIndex];
                fraseIndex = (fraseIndex + 1) % frasesOficina.length;
            } else {
                vMsg.classList.add('hidden');
                vMsg.classList.remove('flex');
                vMain.classList.remove('hidden');
                vMain.classList.add('flex');
                
                document.getElementById('ui-cat').innerText = data.cat;
                document.getElementById('ui-name').innerText = data.name;
                document.getElementById('ui-desc').innerText = data.desc;
                document.getElementById('ui-price').innerText = "$" + data.price.toLocaleString('es-CO');
                
                var img = document.getElementById('ui-img');
                img.src = data.img;
                
                var n = data.name.length;
                img.style.fontSize = n < 8 ? "8vw" : n < 15 ? "6.5vw" : "4.5vw";
            }
        }
    </script>
</body>
</html>
