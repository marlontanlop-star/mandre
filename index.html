<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital Premium | LG webOS Native</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS PURO Y NATIVO OPTIMIZADO PARA EL PROCESADOR DE TV LG --- */
        * {
            box-sizing: border-box;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            color: #ffffff; 
            overflow: hidden; 
            margin: 0;
            padding: 4% 5%;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Contenedor principal ocupando el centro de la TV */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: auto 0;
        }

        /* Transición de opacidad por Hardware */
        .tv-fade {
            opacity: 0;
            -webkit-transition: opacity 0.4s ease-in-out;
            transition: opacity 0.4s ease-in-out;
        }
        .tv-fade-active {
            opacity: 1;
        }

        /* Ocultar punteros en modo pantalla completa */
        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }

        /* Estilos de la interfaz premium */
        .text-gold { color: #D4AF37; }
        .text-muted { color: #888888; }
        .bg-card { background-color: #141414; border: 1px solid #222222; }
        
        /* Sistema de Rejilla Nativa compatible con webOS */
        .grid-layout {
            display: -webkit-box;
            display: flex;
            width: 100%;
            max-width: 1200px;
            align-items: center;
            justify-content: center;
        }
        .grid-col-left { width: 45%; display: flex; justify-content: center; }
        .grid-col-right { width: 55%; padding-left: 5%; text-align: left; }

        /* Estilos específicos para las imágenes de los productos */
        .image-container {
            width: 420px;
            height: 420px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            border: 2px solid #222222;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-cover: cover;
        }

        /* Etiquetas fijas */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .badge-muted { background-color: #141414; border: 1px solid #222222; color: #888888; }
        .badge-gold { background-color: #D4AF37; color: #0a0a0a; margin-left: 10px; }

        /* Contenedor de Precio */
        .price-box {
            display: inline-block;
            font-size: 54px;
            font-weight: 900;
            color: #D4AF37;
            background-color: #141414;
            border: 1px solid #222222;
            padding: 15px 35px;
            border-radius: 24px;
            margin-top: 20px;
            letter-spacing: -2px;
        }

        /* Celdas del café del día */
        .cafe-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .cafe-card { background: #141414; border: 1px solid #222222; padding: 15px 20px; border-radius: 20px; flex: 1; min-width: 45%; }
        .cafe-card-full { width: 100%; background: #141414; border: 1px solid #222222; padding: 20px; border-radius: 20px; margin-top: 15px; }

        /* Footer y Botones */
        footer { width: 100%; display: flex; justify-content: flex-end; opacity: 0.3; }
        .footer-brand { font-size: 14px; color: #aaa; font-weight: 400; }
        .footer-brand b { color: #fff; font-weight: 700; }

        .btn-kiosk {
            position: fixed; bottom: 25px; left: 25px; z-index: 999;
            background: #141414; color: white; padding: 12px 24px;
            border-radius: 30px; font-weight: 700; border: 1px solid #222222;
            cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main id="kiosk-main" class="tv-fade">
        </main>

    <footer>
        <div class="footer-brand" style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase;">
            Power By <span>Tan<b>Alza</b></span>
        </div>
    </footer>

    <button id="btn-fullscreen" class="btn-kiosk">
        Iniciar Kiosko HD
    </button>

    <script>
        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Estados globales livianos
        let dataset = { products: [], config: null };
        let loopState = { currentPhase: 'welcome', productIndex: 0, secondsCounter: 0 };
        const kioskMain = document.getElementById('kiosk-main');

        // --- TRAER DATOS EN TIEMPO REAL ---
        db.collection('inventory').onSnapshot(function(snap) {
            let items = [];
            snap.forEach(function(doc) {
                items.push(doc.data());
            });
            dataset.products = items.sort(function(a, b) {
                return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
            });
            if(loopState.currentPhase === 'product_focus') renderCurrentScreen();
        });

        db.collection('configuracionTV').doc('actual').onSnapshot(function(doc) {
            if (doc.exists) {
                dataset.config = doc.data();
                if(loopState.currentPhase === 'welcome' || loopState.currentPhase === 'cafe_dia') renderCurrentScreen();
            }
        });

        // --- PINTAR PANTALLA CON HTML NATIVO ---
        function renderCurrentScreen() {
            kioskMain.classList.remove('tv-fade-active');
            
            setTimeout(function() {
                let html = '';

                // PANTALLA 1: BIENVENIDA / TEXTO ANUNCIO
                if (loopState.currentPhase === 'welcome') {
                    let texto = (dataset.config && dataset.config.publicidadRecurrente) ? dataset.config.publicidadRecurrente.textoConfigurable : "Disfruta un momento exclusivo";
                    html = `
                        <div style="text-align: center; max-width: 900px;">
                            <span class="text-gold" style="font-size: 14px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; display: block; margin-bottom: 20px;">Sugerencia Especial</span>
                            <h2 style="font-size: 64px; font-weight: 900; line-height: 1.1; text-transform: uppercase; letter-spacing: -2px; margin: 0;">${texto}</h2>
                            <div style="width: 100px; height: 2px; background-color: #D4AF37; margin: 30px auto 0 auto; opacity: 0.4;"></div>
                        </div>
                    `;
                }
                
                // PANTALLA 2: CAFÉ DE ORIGEN
                else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                    let cafe = dataset.config.cafePromocion;
                    let imgSection = cafe.logoUrl 
                        ? `<div class="image-container"><img src="${cafe.logoUrl}" /></div>`
                        : `<div class="image-container" style="font-size: 140px;">☕</div>`;
                    
                    html = `
                        <div class="grid-layout">
                            <div class="grid-col-left">${imgSection}</div>
                            <div class="grid-col-right">
                                <div class="badge badge-gold" style="margin-left: 0;">FILTRADO HOY</div>
                                <h2 style="font-size: 64px; font-weight: 900; letter-spacing: -3px; margin: 0 0 10px 0; line-height: 1;">CAFÉ DE ORIGEN</h2>
                                <div class="cafe-grid">
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Procedencia</p>
                                        <p style="font-size: 24px; font-weight: 700; text-transform: uppercase; margin: 5px 0 0 0;">${cafe.municipio || ''}</p>
                                        <p class="text-gold" style="font-size: 14px; font-weight: 700; text-transform: uppercase; margin: 2px 0 0 0;">${cafe.vereda || ''}</p>
                                    </div>
                                    <div class="cafe-card">
                                        <p class="text-muted" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0;">Altura Cultivo</p>
                                        <p style="font-size: 24px; font-weight: 700; text-transform: uppercase; margin: 5px 0 0 0;">${cafe.altura || ''} <span class="text-muted" style="font-size: 14px; font-weight: 400;">m.s.n.m</span></p>
                                    </div>
                                </div>
                                <div class="cafe-card-full">
                                    <p class="text-muted" style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 5px 0;">Notas de Cata Detectadas</p>
                                    <p class="text-gold" style="font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin: 0;">${cafe.notas || ''}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // PANTALLA 3: PRODUCTO INDIVIDUAL
                else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                    let prod = dataset.products[loopState.productIndex];
                    if (prod) {
                        let badgeDestacado = prod.isPromoted ? `<span class="badge badge-gold">Recomendado ⭐</span>` : '';
                        let descripcionHtml = prod.description ? `<p class="text-muted" style="font-size: 18px; font-weight: 400; line-height: 1.5; margin: 15px 0; border-left: 2px solid #222222; padding-left: 15px;">${prod.description}</p>` : '';
                        
                        let imgSection = prod.imageUrl 
                            ? `<div class="image-container"><img src="${prod.imageUrl}" onerror="this.parentElement.innerHTML='<span style=\"font-size:140px;\">${prod.icon || '☕'}</span>'"/></div>`
                            : `<div class="image-container" style="font-size: 140px;"><span>${prod.icon || '☕'}</span></div>`;

                        html = `
                            <div class="grid-layout">
                                <div class="grid-col-left">${imgSection}</div>
                                <div class="grid-col-right">
                                    <div style="display: flex; align-items: center;">
                                        <span class="badge badge-muted">${prod.category}</span>
                                        ${badgeDestacado}
                                    </div>
                                    <h2 style="font-size: 60px; font-weight: 900; letter-spacing: -2px; text-transform: uppercase; margin: 0; line-height: 1.1;">${prod.name}</h2>
                                    ${descripcionHtml}
                                    <div style="margin-top: 15px;">
                                        <span class="text-muted" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: block;">Precio de Venta</span>
                                        <div class="price-box"><span style="font-size: 30px; font-weight: 300; margin-right: 5px; opacity: 0.7;">$</span>${Number(prod.price).toLocaleString()}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                kioskMain.innerHTML = html;
                kioskMain.classList.add('tv-fade-active');
            }, 50); 
        }

        // --- CONTROLADORES DE TIEMPO / CAMBIO DE PRODUCTO ---
        setInterval(function() {
            loopState.secondsCounter++;

            if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
                if (dataset.config && dataset.config.cafePromocion) {
                    loopState.currentPhase = 'cafe_dia';
                } else if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 10) {
                if (dataset.products.length > 0) {
                    loopState.currentPhase = 'product_focus';
                    loopState.productIndex = 0;
                } else {
                    loopState.currentPhase = 'welcome';
                }
                loopState.secondsCounter = 0;
                renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
                loopState.secondsCounter = 0;
                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++;
                    renderCurrentScreen();
                } else {
                    loopState.currentPhase = 'welcome';
                    loopState.productIndex = 0;
                    renderCurrentScreen();
                }
            }
        }, 1000);

        renderCurrentScreen();

        // --- MANEJO DE PANTALLA COMPLETA NATIVA EN LG (webOS Friendly) ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        
        btnFullscreen.addEventListener('click', function() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        });

        function checkFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                btnFullscreen.style.display = 'none';
            } else {
                btnFullscreen.style.display = 'block';
            }
        }

        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
    </script>
</body>
</html>
