<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital Premium | TV LG Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: {
                            bg: '#0a0a0a',       
                            card: '#141414',     
                            border: '#222222',   
                            gold: '#D4AF37',     
                            textMuted: '#888888' 
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Optimizaciones críticas para procesadores de TVs LG (webOS) */
        * {
            transform: translate3d(0,0,0); /* Fuerza renderizado por GPU */
            backface-visibility: hidden;
            perspective: 1000;
            -webkit-font-smoothing: antialiased;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            color: #ffffff; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }
        ::-webkit-scrollbar { display: none; }
        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }
        
        /* Animación ultra ligera basada en opacidad (Ideal para webOS) */
        .tv-fade-in {
            animation: tvFade 0.6s ease-out forwards;
        }
        @keyframes tvFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const App = () => {
            const [allProducts, setAllProducts] = useState([]);
            const [tvConfig, setTvConfig] = useState(null);
            
            // Usamos un único estado de control para mitigar re-renders innecesarios en el procesador del TV
            const [displayState, setDisplayState] = useState({
                screen: 'welcome',
                productIndex: 0,
                keyTrigger: 0 // Fuerza refresco limpio de la animación CSS
            });

            const [isFullscreen, setIsFullscreen] = useState(false);
            const [imageError, setImageError] = useState(false);

            // Refs para tener acceso inmediato a los datos actualizados dentro del bucle sin causar re-renders
            const catalogRef = useRef([]);
            const configRef = useRef(null);
            const loopTimerRef = useRef(null);

            useEffect(() => {
                // Escucha de inventario en tiempo real
                const unsubInv = db.collection('inventory').onSnapshot(snap => {
                    const items = snap.docs.map(doc => doc.data());
                    // Priorizar destacados: Promoted arriba
                    const ordered = items.sort((a, b) => (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1));
                    catalogRef.current = ordered;
                    setAllProducts(ordered);
                }, err => console.log("Firebase Inv Error en TV:", err));

                // Escucha de configuración TV en tiempo real
                const unsubTv = db.collection('configuracionTV').doc('actual').onSnapshot(doc => {
                    if (doc.exists) {
                        configRef.current = doc.data();
                        setTvConfig(doc.data());
                    }
                }, err => console.log("Firebase TV Config Error:", err));

                return () => {
                    unsubInv();
                    unsubTv();
                    if (loopTimerRef.current) clearInterval(loopTimerRef.current);
                };
            }, []);

            // El motor principal: Un único intervalo estable de 1 segundo (Evita fugas de memoria en webOS)
            useEffect(() => {
                let secondsCounter = 0;
                let currentPhase = 'welcome'; // welcome -> cafe -> products
                let pIdx = 0;

                if (loopTimerRef.current) clearInterval(loopTimerRef.current);

                loopTimerRef.current = setInterval(() => {
                    secondsCounter++;

                    // LÓGICA DE TRANSICIÓN DE PANTALLAS
                    if (currentPhase === 'welcome' && secondsCounter >= 6) {
                        // Cambiar a Café si existe configuración, si no, salta a productos
                        if (configRef.current?.cafePromocion) {
                            currentPhase = 'cafe_dia';
                        } else if (catalogRef.current.length > 0) {
                            currentPhase = 'product_focus';
                            pIdx = 0;
                        }
                        secondsCounter = 0;
                        setImageError(false);
                        setDisplayState(prev => ({ ...prev, screen: currentPhase, productIndex: pIdx, keyTrigger: Math.random() }));
                    } 
                    else if (currentPhase === 'cafe_dia' && secondsCounter >= 10) {
                        if (catalogRef.current.length > 0) {
                            currentPhase = 'product_focus';
                            pIdx = 0;
                        } else {
                            currentPhase = 'welcome';
                        }
                        secondsCounter = 0;
                        setImageError(false);
                        setDisplayState(prev => ({ ...prev, screen: currentPhase, productIndex: pIdx, keyTrigger: Math.random() }));
                    } 
                    else if (currentPhase === 'product_focus' && secondsCounter >= 7) {
                        secondsCounter = 0;
                        setImageError(false);
                        
                        if (pIdx + 1 < catalogRef.current.length) {
                            pIdx++; // Siguiente producto individual
                            setDisplayState(prev => ({ ...prev, productIndex: pIdx, keyTrigger: Math.random() }));
                        } else {
                            currentPhase = 'welcome'; // Fin del catálogo, vuelve a bienvenida
                            setDisplayState(prev => ({ ...prev, screen: 'welcome', productIndex: 0, keyTrigger: Math.random() }));
                        }
                    }
                }, 1000);

                return () => clearInterval(loopTimerRef.current);
            }, [allProducts]);

            const handleStartKiosk = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                setIsFullscreen(true);
            };

            useEffect(() => {
                const onFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', onFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', onFullscreenChange);
            }, []);

            const activeProduct = allProducts[displayState.productIndex];

            return (
                <div className="w-screen h-screen bg-premium-bg text-white p-16 flex flex-col justify-between relative overflow-hidden select-none">
                    
                    {/* --- CONTENIDO PRINCIPAL --- */}
                    <main className="flex-1 flex items-center justify-center w-full" key={displayState.keyTrigger}>
                        
                        {/* PANTALLA 1: BIENVENIDA */}
                        {displayState.screen === 'welcome' && (
                            <div className="text-center space-y-6 max-w-5xl tv-fade-in">
                                <span className="text-premium-gold text-sm font-bold tracking-[0.6em] uppercase block">Sugerencia Especial</span>
                                <h2 className="text-6xl md:text-7xl font-black text-white uppercase leading-tight tracking-tighter">
                                    {tvConfig?.publicidadRecurrente?.textoConfigurable || "Disfruta un momento exclusivo"}
                                </h2>
                                <div className="w-24 h-[2px] bg-premium-gold mx-auto mt-8 opacity-40"></div>
                            </div>
                        )}

                        {/* PANTALLA 2: CAFÉ DEL DÍA */}
                        {displayState.screen === 'cafe_dia' && tvConfig?.cafePromocion && (
                            <div className="w-full grid grid-cols-1 lg:grid-cols-12 gap-16 items-center tv-fade-in max-w-7xl">
                                <div className="lg:col-span-5 flex justify-center">
                                    {tvConfig.cafePromocion.logoUrl ? (
                                        <div className="p-8 bg-premium-card rounded-[3.5rem] border border-premium-border shadow-2xl relative">
                                            <img src={tvConfig.cafePromocion.logoUrl} className="w-96 h-96 object-contain relative z-10" alt="Logo Origen"/>
                                        </div>
                                    ) : (
                                        <div className="w-96 h-96 bg-premium-card border border-premium-border rounded-[3.5rem] flex items-center justify-center text-[10rem] shadow-2xl">☕</div>
                                    )}
                                </div>
                                <div className="lg:col-span-7 text-left space-y-8">
                                    <div className="inline-block border border-premium-gold/40 text-premium-gold text-xs font-bold tracking-[0.4em] uppercase bg-premium-gold/5 px-5 py-2 rounded-full">
                                        FILTRADO HOY
                                    </div>
                                    <h2 className="text-7xl font-black text-white tracking-tighter leading-none">CAFÉ DE ORIGEN</h2>
                                    
                                    <div className="grid grid-cols-2 gap-6 pt-4">
                                        <div className="bg-premium-card p-6 rounded-3xl border border-premium-border">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Procedencia</p>
                                            <p className="text-2xl font-bold text-white uppercase mt-1.5">{tvConfig.cafePromocion.municipio}</p>
                                            <p className="text-sm font-semibold text-premium-gold uppercase mt-0.5">{tvConfig.cafePromocion.vereda}</p>
                                        </div>
                                        <div className="bg-premium-card p-6 rounded-3xl border border-premium-border">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest">Altura de Cultivo</p>
                                            <p className="text-2xl font-bold text-white uppercase mt-1.5">{tvConfig.cafePromocion.altura} <span className="text-sm text-premium-textMuted font-normal">m.s.n.m</span></p>
                                        </div>
                                        <div className="bg-premium-card p-8 rounded-3xl border border-premium-border col-span-2">
                                            <p className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest mb-2">Notas de Cata Detectadas</p>
                                            <p className="text-3xl font-black text-premium-gold uppercase tracking-tight">{tvConfig.cafePromocion.notes || tvConfig.cafePromocion.notas}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PANTALLA 3: PASARELA INDIVIDUAL DE PRODUCTOS */}
                        {displayState.screen === 'product_focus' && activeProduct && (
                            <div className="w-full h-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-16 items-center justify-center tv-fade-in">
                                
                                {/* Contenedor Imagen */}
                                <div className="lg:col-span-6 flex justify-center relative">
                                    {activeProduct.imageUrl && !imageError ? (
                                        <div className="w-full max-w-lg aspect-square rounded-[4rem] overflow-hidden shadow-2xl border-2 border-premium-border relative bg-premium-card flex items-center justify-center">
                                            <img 
                                                src={activeProduct.imageUrl} 
                                                className="w-full h-full object-cover" 
                                                alt={activeProduct.name}
                                                onError={() => setImageError(true)} 
                                            />
                                        </div>
                                    ) : (
                                        <div className="w-full max-w-lg aspect-square bg-premium-card border-2 border-premium-border rounded-[4rem] flex flex-col items-center justify-center text-9xl shadow-2xl">
                                            <span>{activeProduct.icon || '☕'}</span>
                                        </div>
                                    )}
                                </div>

                                {/* Contenedor Textos */}
                                <div className="lg:col-span-6 text-left space-y-6 flex flex-col justify-center">
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] font-bold text-premium-textMuted uppercase tracking-[0.4em] bg-premium-card px-4 py-1.5 rounded-full border border-premium-border">
                                            {activeProduct.category}
                                        </span>
                                        {activeProduct.isPromoted && (
                                            <span className="text-[9px] font-black text-premium-bg bg-premium-gold px-3 py-1 rounded-full uppercase tracking-widest shadow-md">
                                                Recomendado ⭐
                                            </span>
                                        )}
                                    </div>
                                    
                                    <h2 className="text-6xl font-black text-white tracking-tighter uppercase leading-tight max-w-xl">
                                        {activeProduct.name}
                                    </h2>
                                    
                                    {activeProduct.description && (
                                        <p className="text-lg text-premium-textMuted font-medium leading-relaxed max-w-lg pt-2 border-l-2 border-premium-border pl-4">
                                            {activeProduct.description}
                                        </p>
                                    )}

                                    <div className="pt-6">
                                        <span className="text-[10px] font-bold text-premium-textMuted uppercase tracking-widest block mb-1">Precio de Venta</span>
                                        <div className="inline-block text-5xl font-black text-premium-gold tracking-tighter leading-none bg-premium-card border border-premium-border px-8 py-4 rounded-3xl shadow-xl">
                                            <span className="text-3xl font-light mr-1 opacity-70">$</span>
                                            {Number(activeProduct.price).toLocaleString()}
                                        </div>
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* --- FOOTER INFERIOR --- */}
                    <footer className="flex justify-end items-center shrink-0 w-full pt-4">
                        <div className="flex items-center gap-2.5 opacity-30">
                            <span className="text-[9px] text-slate-500 font-bold uppercase tracking-[0.2em]">Power By</span>
                            <span className="font-sans font-normal text-slate-400 text-base tracking-tight">Tan<b className="font-bold text-slate-200">Alza</b></span>
                        </div>
                    </footer>

                    {/* --- BOTÓN INICIAR KIOSKO --- */}
                    {!isFullscreen && (
                        <button 
                            onClick={handleStartKiosk}
                            className="fixed bottom-6 left-6 z-[999] bg-premium-card hover:bg-black text-white px-6 py-4 rounded-full shadow-2xl font-bold flex items-center gap-3 border border-premium-border text-xs tracking-wider uppercase"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            Iniciar Kiosko HD
                        </button>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
