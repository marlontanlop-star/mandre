<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANDRÉ | KIOSCO DIGITAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F5F5F0;
            --coffee: #3E2723;
            --sage: #8FBC8F;
            --dark: #1a1a1a;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: var(--bg); 
            font-family: 'Montserrat', sans-serif; 
            height: 100vh; overflow: hidden; color: var(--coffee);
        }

        .view-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; visibility: hidden; }
        .view-layer.active { opacity: 1; visibility: visible; }

        /* --- CONTENEDOR MODIFICADO PARA PANTALLA COMPLETA --- */
        .card-view {
            width: 100vw; 
            height: 100vh; 
            background: var(--white); 
            display: flex; 
            overflow: hidden;
        }

        /* --- VISTA PRODUCTO --- */
        .info-side { width: 40%; padding: 5rem; display: flex; flex-direction: column; justify-content: center; }
        .img-side { width: 60%; background: #e5e5e5; }
        .img-side img { width: 100%; height: 100%; object-fit: cover; }

        .ui-cat { font-size: 0.7rem; font-weight: 900; letter-spacing: 0.3em; color: var(--sage); text-transform: uppercase; margin-bottom: 1rem; }
        .ui-name { font-size: 3.5rem; font-weight: 900; line-height: 1; margin-bottom: 1.5rem; }
        .ui-price { font-size: 2rem; font-weight: 700; color: var(--coffee); margin-top: 2rem; }

        /* --- VISTA PROMO DINÁMICA --- */
        .promo-view { display: flex; align-items: center; justify-content: center; text-align: center; padding: 4rem; }
        .promo-content { max-width: 800px; }
        .promo-title { font-size: 4rem; font-weight: 900; line-height: 0.9; margin-bottom: 2rem; }
        .promo-desc { font-size: 1.2rem; font-weight: 400; opacity: 0.8; line-height: 1.6; }

        #view-start { position: fixed; inset: 0; background: var(--coffee); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

    <div id="view-start">
        <h1 style="font-size: 4rem; font-weight: 900;">MANDRÉ</h1>
        <button onclick="iniciar()" style="margin-top: 2rem; padding: 1rem 3rem; border-radius: 50px; background: var(--sage); border: none; font-weight: 900; cursor: pointer;">INICIAR PANTALLA</button>
    </div>

    <div id="view-main" class="view-layer">
        <div class="card-view">
            <div class="info-side">
                <div id="ui-cat" class="ui-cat">CAFE</div>
                <h1 id="ui-name" class="ui-name">Espresso</h1>
                <p id="ui-desc" style="font-size: 1.1rem; opacity: 0.7;">Descripción del producto...</p>
                <div id="ui-price" class="ui-price">$0</div>
            </div>
            <div class="img-side">
                <img id="ui-img" src="">
            </div>
        </div>
    </div>

    <div id="view-dynamic" class="view-layer">
        <div id="dyn-layout" class="card-view promo-view">
            <div class="promo-content">
                <div id="dyn-sub" style="font-size: 0.7rem; letter-spacing: 0.3em; font-weight: 900; text-transform: uppercase; margin-bottom: 1rem;"></div>
                <h2 id="dyn-title" class="promo-title"></h2>
                <p id="dyn-desc" class="promo-desc"></p>
            </div>
        </div>
    </div>

    <script>
        // Tu lógica de JavaScript permanece intacta
        let playlist = [];
        let currentIndex = 0;
        let configMaster = { productTime: 8000, promoTime: 12000, promotions: [] };

        function iniciar() {
            // Opcional: Para activar modo pantalla completa real del navegador
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
            document.getElementById('view-start').style.display = 'none';
            obtenerConfiguracion(true);
        }

        function obtenerConfiguracion(cargarInventarioDespues) {
            fetch("https://firestore.googleapis.com/v1/projects/mandre-f9e43/databases/(default)/documents/kiosk_settings/master")
            .then(res => res.json())
            .then(conf => {
                if(conf.fields) {
                    configMaster.productTime = Number(conf.fields.productTime?.integerValue || 8000);
                    configMaster.promoTime = Number(conf.fields.promoTime?.integerValue || 12000);
                    configMaster.promotions = [];
                    if(conf.fields.promotions?.arrayValue.values) {
                        conf.fields.promotions.arrayValue.values.forEach(p => {
                            let m = p.mapValue.fields;
                            if(m.active?.booleanValue) configMaster.promotions.push({
                                title: m.title?.stringValue, subtitle: m.subtitle?.stringValue,
                                desc: m.desc?.stringValue, bgColor: m.bgColor?.stringValue, accentColor: m.accentColor?.stringValue
                            });
                        });
                    }
                }
                if(cargarInventarioDespues) loadInventory();
            });
        }

        function loadInventory() {
            fetch("https://firestore.googleapis.com/v1/projects/mandre-f9e43/databases/(default)/documents/inventory?pageSize=300")
            .then(res => res.json())
            .then(data => {
                let products = data.documents.map(d => d.fields).filter(f => f.isPromoted?.booleanValue);
                playlist = [];
                products.forEach((p, i) => {
                    playlist.push({ type: 'product', data: p });
                    if ((i + 1) % 2 === 0) {
                        configMaster.promotions.forEach(promo => playlist.push({ type: 'promo', data: promo }));
                    }
                });
                reproducir();
            });
        }

        function reproducir() {
            let item = playlist[currentIndex];
            document.querySelectorAll('.view-layer').forEach(el => el.classList.remove('active'));
            
            if(item.type === 'product') {
                document.getElementById('ui-cat').innerText = item.data.category?.stringValue || "MANDRÉ";
                document.getElementById('ui-name').innerText = item.data.name?.stringValue || "";
                document.getElementById('ui-desc').innerText = item.data.description?.stringValue || "";
                document.getElementById('ui-price').innerText = "$" + Number(item.data.price?.integerValue || 0).toLocaleString();
                document.getElementById('ui-img').src = item.data.imageUrl?.stringValue || "";
                document.getElementById('view-main').classList.add('active');
            } else {
                document.getElementById('dyn-sub').innerText = item.data.subtitle;
                document.getElementById('dyn-title').innerHTML = item.data.title.replace(/\n/g, '<br>');
                document.getElementById('dyn-desc').innerText = item.data.desc;
                document.getElementById('dyn-layout').style.backgroundColor = item.data.bgColor;
                document.getElementById('dyn-layout').style.color = item.data.accentColor;
                document.getElementById('view-dynamic').classList.add('active');
            }

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % playlist.length;
                reproducir();
            }, item.type === 'product' ? configMaster.productTime : configMaster.promoTime);
        }
    </script>
</body>
</html>
