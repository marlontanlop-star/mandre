<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosco Digital Inteligente | LA OFICINA Anserma</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- BLINDAJE ABSOLUTO GENERAL --- */
        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0); 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        
        html, body {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            background-color: #FFFFFF; /* Blanco exterior */
            color: #111111;
            font-family: 'Montserrat', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- EL CONTENEDOR INTELIGENTE ---
           Este bloque mantendrá una proporción interna de 1920x1080 fija en memoria.
           El script de abajo lo centrará y lo escalará matemáticamente según el TV. */
        #tv-scale-canvas {
            position: absolute;
            width: 1920px;
            height: 1080px;
            top: 50%;
            left: 50%;
            margin-left: -960px;
            margin-top: -540px;
            overflow: hidden !important;
            -webkit-transform-origin: center center;
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px 100px; /* Margen interno de seguridad de diseño */
        }

        main {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden !important;
        }

        .tv-fade {
            opacity: 0;
            -webkit-transition: opacity 0.3s ease-in-out;
            transition: opacity 0.3s ease-in-out;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tv-fade-active {
            opacity: 1;
        }

        :fullscreen { cursor: none; }
        :-webkit-full-screen { cursor: none; }

        .text-accent { color: #8C6239; } 
        .text-dark { color: #000000; }
        .text-muted { color: #666666; font-weight: 700; }
        
        /* Layout de Rejilla Estricto dentro de la Matriz Virtual */
        .grid-layout {
            display: flex;
            width: 100%;
            height: 760px; /* Altura segura fija dentro de los 1080px */
            align-items: center;
            justify-content: space-between;
        }

        .col-left-photo {
            width: 760px;
            height: 760px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .col-right-info {
            width: 880px;
            height: 760px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            overflow: hidden;
        }

        /* CAJA CONTENEDORA DE IMAGEN REFORZADA */
        .image-box-safe {
            width: 760px;
            height: 760px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05); 
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-box-safe img {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
            background-color: #FFFFFF;
            border-radius: 40px;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            border-radius: 40px;
        }

        /* Tamaños de fuentes e indicadores perfectos basados en el Canvas de 1920x1080 */
        .badge {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .badge-muted { background-color: #F1F3F5; color: #495057; }
        .badge-accent { background-color: #8C6239; color: #FFFFFF; margin-left: 15px; }

        h2.item-title {
            font-size: 78px; 
            font-weight: 900; 
            letter-spacing: -2px; 
            text-transform: uppercase; 
            margin: 0; 
            line-height: 1.1; 
            color:#000000;
        }

        p.item-desc {
            font-size: 28px; 
            font-weight: 700; 
            line-height: 1.5; 
            margin: 25px 0; 
            border-left: 6px solid #8C6239; 
            padding-left: 25px;
            color: #222222;
        }

        .price-box {
            display: inline-block;
            font-size: 82px; 
            font-weight: 900;
            color: #000000;
            background-color: #F8F9FA;
            padding: 10px 45px;
            border-radius: 28px;
            margin-top: 20px;
            letter-spacing: -3px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.01);
        }

        .cafe-grid { display: flex; gap: 25px; margin-top: 25px; width: 100%; }
        .cafe-card { background: #F8F9FA; padding: 25px 30px; border-radius: 28px; flex: 1; }
        .cafe-card p { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .cafe-card h3 { font-size: 32px; font-weight: 900; text-transform: uppercase; color: #000; }
        .cafe-card h4 { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        
        .cafe-card-full { width: 100%; background: #F8F9FA; padding: 30px; border-radius: 28px; margin-top: 25px; }
        .cafe-card-full p { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .cafe-card-full h3 { font-size: 38px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }

        .center-layout {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phrase-container {
            text-align: center;
            width: 100%;
            max-width: 1300px;
            padding: 70px;
            background-color: #FFFDF9;
            border-radius: 50px;
            box-shadow: 0 25px 60px rgba(140,98,57,0.03);
        }
        .phrase-container h2 { font-size: 58px; font-weight: 900; line-height: 1.4; color: #000000; margin-bottom: 20px; }
        .phrase-container p { font-size: 18px; letter-spacing: 4px; text-transform: uppercase; }

        /* Footer estático controlado en coordenadas de matriz */
        footer { 
            width: 100%;
            display: flex; 
            justify-content: flex-end; 
            opacity: 0.5; 
            padding-top: 20px;
        }
        .footer-brand { font-size: 18px; color: #111111; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .footer-brand b { color: #8C6239; font-weight: 900; }

        .btn-kiosk {
            position: fixed; bottom: 30px; left: 30px; z-index: 999;
            background: #111111; color: white; padding: 16px 32px;
            border-radius: 40px; font-weight: 900; border: none;
            cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="tv-scale-canvas">
        
        <main id="kiosk-main" class="tv-fade">
            </main>

        <footer>
            <div class="footer-brand">
                Power By <span>Tan<b>Alza</b></span>
            </div>
        </footer>

    </div>

    <button id="btn-fullscreen" class="btn-kiosk">Iniciar Kiosko Exterior</button>

    <script>
        // --- ALGORITMO INTEGRADO DE ESCALA INTELIGENTE (ANTI-DESBORDES Y AJUSTE DE TV GIGANTE) ---
        function ajustarEscalaPantallaTV() {
            var canvas = document.getElementById('tv-scale-canvas');
            if (!canvas) return;
            
            // Obtener el tamaño exacto actual del navegador del TV LG
            var windowWidth = window.innerWidth;
            var windowHeight = window.innerHeight;
            
            // Calcular factor matemático de escala tomando como base fija 1920x1080
            var scaleX = windowWidth / 1920;
            var scaleY = windowHeight / 1080;
            
            // Utilizar la menor escala para asegurar que el contenido quepa al 100% sin importar la resolución
            var scaleFinal = Math.min(scaleX, scaleY);
            
            // Aplicar la matriz de escala por hardware nativo de webOS
            canvas.style.transform = 'scale(' + scaleFinal + ')';
            canvas.style.webkitTransform = 'scale(' + scaleFinal + ')';
        }

        // Ejecutar al cargar la página y cada vez que cambie el tamaño (como al entrar a pantalla completa)
        window.addEventListener('resize', ajustarEscalaPantallaTV);
        window.addEventListener('load', ajustarEscalaPantallaTV);
        setTimeout(ajustarEscalaPantallaTV, 100); // Disparo de seguridad para webOS antiguos

        // --- CONFIGURACIÓN DE TU FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAutOqky0mpVmwDrqFsyZ0zRl_abrzgPvc",
            authDomain: "mandre-f9e43.firebaseapp.com",
            projectId: "mandre-f9e43",
            storageBucket: "mandre-f9e43.firebasestorage.app",
            messagingSenderId: "865403538422",
            appId: "1:865403538422:web:0ee2fb754343de9bc015d7"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let dataset = { products: [], config: null };
        
        let loopState = { 
            currentPhase: 'welcome', 
            productIndex: 0, 
            secondsCounter: 0,
            productsShownInSession: 0, 
            phraseIndex: 0,
            promoToggle: false // Añadido para alternar entre frase local y promo Mastercard
        };

        const localPhrases = [
            "El mejor punto de encuentro en la 'Abuela de Caldas'. ¡Ven a La Oficina por tu dosis de bienestar!",
            "Café de especialidad cultivado en nuestras montañas caldenses, servido con orgullo en Anserma.",
            "¿Trabajo, amigos o un respiro? El espacio ideal para conectar y recargar tus energías está en La Oficina.",
            "Pasión por los detalles, amor por el origen. Vive la verdadera cultura cafetera en el corazón de Anserma.",
            "Mucho más que una taza de café. Creamos experiencias premium de Specialty Coffee & Wellness para ti."
        ];

        const kioskMain = document.getElementById('kiosk-main');

        // Escuchar Inventario con Filtro de Transmisión
        db.collection('inventory').onSnapshot(function(snap) {
            let items = [];
            snap.forEach(function(doc) {
                let p = doc.data();
                if (p.showOnTv !== false) { items.push(p); }
            });
            dataset.products = items.sort(function(a, b) {
                return (b.isPromoted === a.isPromoted ? 0 : b.isPromoted ? 1 : -1);
            });
            if(loopState.currentPhase === 'product_focus' && (!dataset.config || !dataset.config.pautaExpressActiva)) renderCurrentScreen();
        });

        // Escuchar Configuración TV
        db.collection('configuracionTV').doc('actual').onSnapshot(function(doc) {
            if (doc.exists) {
                dataset.config = doc.data();
                renderCurrentScreen(); 
            }
        });

        window.handleImageError = function(imageElement) {
            if(imageElement && imageElement.parentElement) {
                imageElement.parentElement.innerHTML = '<div class="image-placeholder"></div>';
            }
        };

        // --- MOTOR RENDER NATIVO BAJO MATRIZ DE SEGURIDAD ---
        function renderCurrentScreen() {
            kioskMain.classList.remove('tv-fade-active');
            
            setTimeout(function() {
                let html = '';

                // INTERRUPTOR: ANUNCIO EXPRESS DE TEMPORADA
                if (dataset.config && dataset.config.pautaExpressActiva === true) {
                    let tituloExpress = dataset.config.pautaExpressTitulo || "ANUNCIO ESPECIAL";
                    let textoExpress = dataset.config.pautaExpressTexto || "Promoción exclusiva disponible ahora.";
                    html = `
                        <div class="center-layout">
                            <div class="phrase-container" style="border: 6px solid #8C6239;">
                                <span class="badge badge-accent" style="margin-bottom:25px; padding: 12px 28px; font-size:16px;">DESTACADO DE LA SEMANA 🚨</span>
                                <h2 style="font-size: 64px; font-weight: 900; line-height: 1.2; color: #8C6239; text-transform: uppercase; margin-bottom:25px;">${tituloExpress}</h2>
                                <p style="font-size: 32px; font-weight: 700; color: #111111; line-height: 1.5; max-width:1000px; margin: 0 auto;">${textoExpress}</p>
                                <p class="text-muted" style="font-size: 14px; margin-top: 35px; letter-spacing: 4px; text-transform: uppercase;">La Oficina Anserma • Sabores de Temporada</p>
                            </div>
                        </div>
                    `;
                    kioskMain.innerHTML = html;
                    kioskMain.classList.add('tv-fade-active');
                    ajustarEscalaPantallaTV();
                    return;
                }

                // CASO 1: PANTALLA BIENVENIDA
                if (loopState.currentPhase === 'welcome') {
                    let texto = (dataset.config && dataset.config.publicidadRecurrente) ? dataset.config.publicidadRecurrente.textoConfigurable : "Bienvenidos a una experiencia exclusiva";
                    html = `
                        <div class="center-layout">
                            <div style="text-align: center; max-width: 1200px;">
                                <span class="text-accent" style="font-size: 20px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; display: block; margin-bottom: 25px;">Recomendación Especial</span>
                                <h2 style="font-size: 72px; font-weight: 900; line-height: 1.2; text-transform: uppercase; color: #000000; letter-spacing: -1px; margin: 0;">${texto}</h2>
                                <div style="width: 160px; height: 5px; background-color: #8C6239; margin: 30px auto 0 auto;"></div>
                            </div>
                        </div>
                    `;
                }
                
                // CASO 2: CAFÉ DE ORIGEN
                else if (loopState.currentPhase === 'cafe_dia' && dataset.config && dataset.config.cafePromocion) {
                    let cafe = dataset.config.cafePromocion;
                    let cafeImg = cafe.logoUrl || cafe.logourl || cafe.imageUrl || cafe.imageurl || "";
                    let imgSection = (cafeImg && cafeImg.length > 10)
                        ? `<div class="image-box-safe"><img src="${cafeImg}" onerror="window.handleImageError(this)" /></div>`
                        : `<div class="image-box-safe"><div class="image-placeholder"></div></div>`;
                    
                    html = `
                        <div class="grid-layout">
                            <div class="col-left-photo">${imgSection}</div>
                            <div class="col-right-info">
                                <div class="badge badge-accent" style="margin-left: 0; width: fit-content;">FILTRADO HOY</div>
                                <h2 class="item-title" style="font-size:74px; margin-bottom:15px;">CAFÉ DE ORIGEN</h2>
                                <div class="cafe-grid">
                                    <div class="cafe-card">
                                        <p class="text-muted">Procedencia</p>
                                        <h3>${cafe.municipio || ''}</h3>
                                        <h4 class="text-accent">${cafe.vereda || ''}</h4>
                                    </div>
                                    <div class="cafe-card">
                                        <p class="text-muted">Altura Cultivo</p>
                                        <h3>${cafe.altura || ''} <span style="font-size: 20px; font-weight: 700; color:#666;">m</span></h3>
                                    </div>
                                </div>
                                <div class="cafe-card-full">
                                    <p class="text-muted">Notas de Cata Detectadas</p>
                                    <h3 class="text-accent">${cafe.notas || ''}</h3>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // CASO 3: PASARELA INDIVIDUAL DE PRODUCTOS
                else if (loopState.currentPhase === 'product_focus' && dataset.products.length > 0) {
                    let prod = dataset.products[loopState.productIndex];
                    if (prod) {
                        let badgeDestacado = prod.isPromoted ? `<span class="badge badge-accent">Recomendado ⭐</span>` : '';
                        let descripcionHtml = prod.description ? `<p class="item-desc">${prod.description}</p>` : '';
                        
                        let linkFoto = prod.imageUrl || prod.imageurl || prod.image || prod.url || "";
                        let imgSection = (linkFoto && linkFoto.length > 10)
                            ? `<div class="image-box-safe"><img src="${linkFoto}" onerror="window.handleImageError(this)"/></div>`
                            : `<div class="image-box-safe"><div class="image-placeholder"></div></div>`;

                        html = `
                            <div class="grid-layout">
                                <div class="col-left-photo">${imgSection}</div>
                                <div class="col-right-info">
                                    <div style="display: flex; align-items: center; width: fit-content;">
                                        <span class="badge badge-muted">${prod.category}</span>
                                        ${badgeDestacado}
                                    </div>
                                    <h2 class="item-title">${prod.name}</h2>
                                    ${descripcionHtml}
                                    <div style="margin-top: 15px;">
                                        <span class="text-muted" style="font-size: 14px; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom:5px;">Precio de Venta</span>
                                        <div class="price-box"><span style="font-size: 38px; font-weight: 400; margin-right: 5px; color:#555;">$</span>${Number(prod.price).toLocaleString()}</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                // CASO 4: FRASES DE ANSERMA CALDAS
                else if (loopState.currentPhase === 'local_phrase') {
                    let fraseActual = localPhrases[loopState.phraseIndex];
                    html = `
                        <div class="center-layout">
                            <div class="phrase-container">
                                <span class="text-accent" style="font-size: 18px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; display: block; margin-bottom: 25px;">La Oficina Anserma</span>
                                <h2>"${fraseActual}"</h2>
                               <p class="text-muted">Specialty Coffee & Wellness • Caldas</p>
                            </div>
                        </div>
                    `;
                }

                // CASO 5: PROMO MASTERCARD (Diseño Exacto y Minimalista)
                else if (loopState.currentPhase === 'mastercard_promo') {
                    html = `
                        <div class="center-layout">
                            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-color: #FFFFFF; border-radius: 40px; border-top: 12px solid #EB001B; border-bottom: 12px solid #F79E1B; box-shadow: 0 15px 40px rgba(0,0,0,0.03);">
                                
                                <!-- Logo Mastercard -->
                                <div style="margin-bottom: 35px;">
                                    <svg width="250" height="150" viewBox="0 0 120 80" style="overflow: visible;">
                                        <circle cx="40" cy="40" r="30" fill="#EB001B"/>
                                        <circle cx="80" cy="40" r="30" fill="#F79E1B"/>
                                        <path d="M60 17.64A30 30 0 0 0 60 62.36A30 30 0 0 0 60 17.64Z" fill="#FF5F00"/>
                                        <text x="60" y="95" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" text-anchor="middle" fill="#111111">mastercard</text>
                                    </svg>
                                </div>

                                <!-- Pregunta de gancho -->
                                <h2 style="font-size: 60px; font-weight: 900; margin: 0 0 45px 0; color: #111111; line-height: 1.2;">
                                    ¿Un cafecito para arrancar el día<br>o cócteles para cerrar la semana?
                                </h2>

                                <!-- Insignia X2 Puntos Minimalista pero llamativa -->
                                <div style="display: inline-block; padding: 25px 80px; border-radius: 80px; margin-bottom: 55px; background: #FFF9F9; border: 4px solid #EB001B;">
                                    <h3 style="font-size: 72px; font-weight: 900; margin: 0; color: #EB001B; letter-spacing: 1px;">¡X2 EN PUNTOS!</h3>
                                </div>

                                <!-- Mensaje principal -->
                                <h4 style="font-size: 42px; font-weight: 900; color: #111111; margin-bottom: 30px; text-transform: uppercase;">
                                    ¡Sumas el doble de puntos en automático!
                                </h4>
                                
                                <p style="font-size: 28px; font-weight: 500; color: #666666; max-width: 1300px; margin: 0 auto; line-height: 1.5;">
                                    El plan perfecto sí existe. Ven a parchar, paga con tus tarjetas <b style="color:#111111; font-weight: 900;">Mastercard</b>, acumula puntos y redímelos en productos de la carta.
                                </p>

                            </div>
                        </div>
                    `;
                }

                kioskMain.innerHTML = html;
                kioskMain.classList.add('tv-fade-active');
                ajustarEscalaPantallaTV(); // Forzar recalculo tras pintar el HTML
            }, 50); 
        }

        // --- ENGRANAJE DE TIEMPOS ---
        setInterval(function() {
            if(dataset.config && dataset.config.pautaExpressActiva === true) return;

            loopState.secondsCounter++;

            if (loopState.currentPhase === 'welcome' && loopState.secondsCounter >= 6) {
                if (dataset.config && dataset.config.cafePromocion) { loopState.currentPhase = 'cafe_dia'; } 
                else if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; }
                loopState.secondsCounter = 0; renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'cafe_dia' && loopState.secondsCounter >= 10) {
                if (dataset.products.length > 0) { loopState.currentPhase = 'product_focus'; loopState.productIndex = 0; } 
                else { loopState.currentPhase = 'welcome'; }
                loopState.secondsCounter = 0; renderCurrentScreen();
            } 
            else if (loopState.currentPhase === 'product_focus' && loopState.secondsCounter >= 7) {
                loopState.secondsCounter = 0;
                loopState.productsShownInSession++; 

                if (loopState.productsShownInSession >= 4) {
                    loopState.productsShownInSession = 0; 
                    
                    // Lógica para alternar entre la promo de Mastercard y las frases locales de Anserma
                    if (!loopState.promoToggle) {
                        loopState.currentPhase = 'mastercard_promo';
                        loopState.promoToggle = true;
                    } else {
                        loopState.currentPhase = 'local_phrase';
                        loopState.promoToggle = false;
                    }
                    
                    renderCurrentScreen();
                } else {
                    if (loopState.productIndex + 1 < dataset.products.length) {
                        loopState.productIndex++; renderCurrentScreen();
                    } else {
                        loopState.currentPhase = 'welcome'; loopState.productIndex = 0; renderCurrentScreen();
                    }
                }
            }
            // Control de tiempo para la nueva promo MASTERCARD (16 segundos = El doble de tiempo normal)
            else if (loopState.currentPhase === 'mastercard_promo' && loopState.secondsCounter >= 16) {
                loopState.secondsCounter = 0;
                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++; loopState.currentPhase = 'product_focus';
                } else {
                    loopState.currentPhase = 'welcome'; loopState.productIndex = 0;
                }
                renderCurrentScreen();
            }
            else if (loopState.currentPhase === 'local_phrase' && loopState.secondsCounter >= 8) {
                loopState.secondsCounter = 0;
                loopState.phraseIndex = (loopState.phraseIndex + 1) % localPhrases.length;

                if (loopState.productIndex + 1 < dataset.products.length) {
                    loopState.productIndex++; loopState.currentPhase = 'product_focus';
                } else {
                    loopState.currentPhase = 'welcome'; loopState.productIndex = 0;
                }
                renderCurrentScreen();
            }
        }, 1000);

        renderCurrentScreen();

        // --- PANTALLA COMPLETA NATIVA EN LG ---
        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', function() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        });

        function checkFullscreen() {
            if (document.fullscreenElement || document.webkitFullscreenElement) { 
                btnFullscreen.style.display = 'none'; 
            } else { 
                btnFullscreen.style.display = 'block'; 
            }
            setTimeout(ajustarEscalaPantallaTV, 150); // Recalcular la matriz al cambiar de estado
        }
        document.addEventListener('fullscreenchange', checkFullscreen);
        document.addEventListener('webkitfullscreenchange', checkFullscreen);
    </script>
</body>
</html>
